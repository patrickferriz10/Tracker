<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nutrition">
<title>Nutrition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1216; --surface:#161C22; --surface-2:#1E262E; --line:#28323C;
  --ink:#ECEFF3; --muted:#8A97A5; --faint:#5C6773;
  --ok:#4DB6A5;
  /* Una tinta por comida, en orden fijo y validadas sobre el fondo oscuro */
  --c-des:#3987e5; --c-bat:#d95926; --c-com:#199e70; --c-mer:#c98500; --c-cen:#d55181;
  --pad:16px;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 15px/1.45 "Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding:16px var(--pad) 70px}
button,input{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{background:none;border:none;padding:0;cursor:pointer}

.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.head h1{font-size:17px;font-weight:600;margin:0}
.head .sub{font-size:12.5px;color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--ok)}.dot.syncing{background:#E8A33D;animation:p 1s infinite}.dot.err{background:#E2574C}
@keyframes p{50%{opacity:.3}}

.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:16px}
.tabs button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.tabs button.on{background:var(--surface-2);color:var(--ink);font-weight:600}

/* Días */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.days button{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:7px 2px;text-align:center}
.days button .l{display:block;font-size:11px;color:var(--faint)}
.days button .n{display:block;font-size:15px;font-weight:600;margin-top:1px}
.days button.on{background:var(--ink);border-color:var(--ink)}
.days button.on .l,.days button.on .n{color:var(--bg)}
.days button.hoy:not(.on){border-color:var(--muted)}

/* Resumen del día */
.sum{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.sum .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sum .big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.sum .big small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.sum .obj{font-size:12.5px;color:var(--faint);text-align:right}
.sum .tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:2px 7px;margin-top:6px}
.bar{position:relative;display:flex;gap:2px;height:14px;margin:14px 0 6px}
.bar i{display:block;height:100%;border-radius:4px;cursor:pointer;transition:opacity .15s}
.bar.focus i{opacity:.35}.bar.focus i.f{opacity:1}
.bar .tick{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:1px}
.scale{position:relative;height:16px;font-size:11px;color:var(--faint)}
.scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.legend span i{width:9px;height:9px;border-radius:3px;display:block}
.legend span b{color:var(--ink);font-weight:600}
.tip{font-size:12.5px;color:var(--faint);margin-top:10px;line-height:1.5}

/* Comidas */
.meal{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;transition:border-color .15s}
.meal.f{border-color:var(--muted)}
.meal .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.meal .bd{flex:1;min-width:0}
.meal .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meal .ty{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.meal .kc{font-size:12.5px;color:var(--muted);white-space:nowrap}
.meal .ti{font-size:15.5px;font-weight:600;margin-top:2px;line-height:1.3}
.meal .wh{font-size:12.5px;color:var(--faint);margin-top:1px}
.meal ul{margin:6px 0 0;padding:0;list-style:none}
.meal li{font-size:13.5px;color:var(--muted);padding-left:12px;position:relative;margin-top:2px}
.meal li::before{content:"";position:absolute;left:0;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--faint)}
.meal.libre{background:transparent;border-style:dashed}
.meal.libre .ti{color:var(--muted);font-weight:500}

/* Tarjetas genéricas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{font-size:16px;font-weight:600;margin:0 0 2px}
.card .meta{font-size:12.5px;color:var(--faint);margin-bottom:10px}
.card p{font-size:14px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.card p b{color:var(--ink);font-weight:600}
.hoytoca{border-color:var(--c-com)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--bg);background:var(--c-com);border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.need{background:var(--bg);border-radius:11px;padding:10px 12px;font-size:13.5px;color:var(--muted);line-height:1.55}
.need b{color:var(--ink)}
.steps{margin-top:12px}
.st{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.st .t{width:38px;flex:none;font-size:13px;font-weight:600;color:var(--muted)}
.st .x{flex:1;font-size:14px;line-height:1.4}
.st.k .x{font-weight:600}
.rep{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin-top:12px;font-size:13.5px}
.rep .d{color:var(--faint);font-weight:600}
.rep .v{color:var(--muted)}
.h3{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px}

/* Reglas */
.plate{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.plate div{background:var(--bg);border-radius:12px;padding:12px}
.plate .ic{font-size:22px}
.plate b{display:block;font-size:14px;margin-top:4px}
.plate span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.yesno{display:flex;gap:8px;margin-top:10px}
.yesno div{flex:1;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.yesno div b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.yes b{color:var(--ok)}.no b{color:#E2574C}
.knob{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.knob div{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:11px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.knob div b{color:var(--ink);font-weight:600;min-width:92px}

/* Compra */
.shop-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.shop-top b{font-size:15px}
.shop-top span{font-size:12.5px;color:var(--faint)}
.prog{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.cat{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:16px 0 4px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item .bx{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--faint);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--bg)}
.item.on .bx{background:var(--ok);border-color:var(--ok)}
.item .nm{flex:1;font-size:14.5px}
.item .nm small{display:block;font-size:12px;color:var(--faint)}
.item .q{font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.item.on .nm,.item.on .q{color:var(--faint);text-decoration:line-through}
.addrow{display:flex;gap:8px;margin-top:16px}
.addrow input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14.5px;outline:none}
.addrow button,.btn{background:var(--ink);color:var(--bg);font-weight:600;border-radius:11px;padding:11px 16px;font-size:14.5px}
.btn{width:100%;padding:14px;margin-top:6px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted);margin-top:10px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;transition:.2s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>Nutrition</h1><div class="sub" id="sub"></div></div>
    <span class="dot" id="sync"></span>
  </div>

  <div class="tabs" id="tabs">
    <button data-v="menu" class="on">Menu</button>
    <button data-v="cocina">Cooking</button>
    <button data-v="compra">Shopping</button>
    <button data-v="reglas">Rules</button>
  </div>

  <section id="v-menu"></section>
  <section id="v-cocina" class="hide"></section>
  <section id="v-compra" class="hide"></section>
  <section id="v-reglas" class="hide"></section>
</div>
<div class="toast" id="toast"></div>

<script>
// ═══ CONFIGURACIÓN ══════════════════════════════════════════
const SB_URL = 'https://jqmfbodxyidnwnvqfjfh.supabase.co';
const SB_KEY = 'sb_publishable_VzI9uNGpvzXuK3ZIodJCNw_H39Ri-ey';
const OBJETIVO = 3400;   // kcal al día
const ESCALA = 4200;     // tope de la barra

// ═══ FECHAS ═════════════════════════════════════════════════
const DIAS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const CORTO = ['S','M','T','W','T','F','S'];
const MESES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ds = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const add = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
const q = new URLSearchParams(location.search).get('hoy');   // ?hoy=2026-10-06 para probar
const HOY = q && /^\d{4}-\d{2}-\d{2}$/.test(q) ? q : ds(new Date());
const LUNES = add(HOY, -((pd(HOY).getDay()+6)%7));
const kfmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

// ═══ COMIDAS ════════════════════════════════════════════════
const TIPO = {
  des:{ nom:'Breakfast', ic:'🥣', col:'var(--c-des)' },
  bat:{ nom:'Shake',     ic:'🥤', col:'var(--c-bat)' },
  com:{ nom:'Lunch',     ic:'🍱', col:'var(--c-com)' },
  mer:{ nom:'Afternoon snack', ic:'🥖', col:'var(--c-mer)' },
  cen:{ nom:'Dinner',    ic:'🍽️', col:'var(--c-cen)' }
};

const DES = {
  avena:   { ti:'Oats', det:['40 g of oats with 300 ml of whole milk','A banana and a spoonful of peanut butter'], kcal:540 },
  huevos:  { ti:'Scrambled eggs', det:['Three eggs and two slices of toast with oil','A piece of fruit'], kcal:520 },
  yogur:   { ti:'Greek yoghurt', det:['Two Greek yoghurts with granola, honey and walnuts','A slice of toast with ham'], kcal:600 },
  tortitas:{ ti:'Pancakes', det:['40 g of oats, two eggs and a banana, blended and into the frying pan','With honey and peanut butter'], kcal:520 }
};
const BATIDO_DET = ['Made the night before: 400 ml of whole milk, 50 g of oat flour, 30 g of whey and the creatine','The banana whole, on the side'];
const bocadillo = relleno => ({ ti:relleno+' and cheese sandwich', det:['Half a ciabatta from the freezer, with a drizzle of oil','A small handful of nuts on the side'], kcal:700 });
const cena = (guarn, extra) => ({ ti:'Home-cooked meat + '+guarn, det:['The meat is cooked at home: you add half a plate of '+guarn+' and bread'].concat(extra||[]), kcal:800 });

// Cada día: lista de comidas. B = semana con partido el domingo.
function menu(dow, B){
  const M = (tipo, hora, donde, o, libre) => Object.assign({ tipo, hora, donde, libre:!!libre }, o);
  const batOficina = M('bat','11:00','At the office',{ ti:'Shake + banana', det:BATIDO_DET, kcal:670 });
  switch(dow){
    case 1: return [
      M('des','07:00','At home', DES.avena),
      batOficina,
      M('com','13:45','At work',{ ti:'Rice with chicken and veg', det:['Lunchbox from Sunday’s big batch cook','With the yoghurt and garlic sauce'], kcal:950 }),
      M('mer','18:00','During the class break', bocadillo('Serrano ham')),
      M('cen','21:30','At home', cena('roast potatoes'))
    ];
    case 2: return [
      M('des','07:00','At home', DES.huevos),
      batOficina,
      M('com','14:30','At the gym',{ ti:'Rice with chicken and veg', det:['Lunchbox from Sunday’s big batch cook','With the soy and honey sauce'], kcal:950 }),
      M('mer','16:15','After the gym', bocadillo('Cured pork loin')),
      M('mer','18:30','Before heading to the fitness coach',{ ti:'A banana', ic:'🍌', det:['Half an hour before training, so you don’t arrive on empty'], kcal:100 }),
      M('cen','20:30','At home, back from the fitness coach', cena('rice', ['While the Tuesday batch is cooking']))
    ];
    case 3: return [
      M('des','07:00','At home', DES.avena),
      batOficina,
      M('com','13:45','At work',{ ti:'Chicken with roast potatoes and veg', det:['Last lunchbox from Sunday’s big batch cook'], kcal:850 }),
      M('mer','18:00','During the class break', bocadillo('Serrano ham')),
      M('cen','21:45','At home', cena('pasta', ['Tonight, pack Thursday’s two lunchboxes']))
    ];
    case 4: return [
      M('des','07:00','At home', DES.yogur),
      batOficina,
      M('com','13:45','At work',{ ti:'Light lunch', det:['Fruit and bread with ham','Futsal at 15:00: no full plate today'], kcal:360 }),
      M('com','16:30','Back from futsal',{ ti:'Macaroni with mince', det:['The second lunchbox, from the Tuesday batch'], kcal:850 }),
      M('mer', B?'19:30':'18:30', B?'After the gym':'Before training', bocadillo('Cured pork loin')),
      M('cen', B?'21:00':'21:45','At home', cena('roast potatoes'))
    ];
    case 5: return [
      M('des','07:00','At home', DES.huevos),
      B ? batOficina : M('bat','11:00','At the office',{ ti:'Shake + banana + Greek yoghurt', det:['The usual shake and a yoghurt','Lunch is light today, so mid-morning is bigger'], kcal:770 }),
      B ? M('com','14:30','At home',{ ti:'Macaroni with mince', det:['Full portion: no gym this afternoon'], kcal:850 })
        : M('com','14:30','At home',{ ti:'Half a portion of macaroni', det:['From the Tuesday batch','Gym in 45 minutes'], kcal:450 }),
      M('mer', B?'19:00':'16:40', B?'After class':'On the way to class', bocadillo('Serrano ham')),
      B ? M('cen','21:45','At home', cena('pasta'))
        : M('cen','20:45','At home, back from English class',{ ti:'Big dinner: meat + a full plate of pasta', det:['Today it’s the main meal of the day','A full plate, not half, and bread'], kcal:1000 })
    ];
    case 6: return [
      M('des','09:00','At home', DES.tortitas),
      M('bat', B?'12:30':'11:30', B?'After the gym':'Mid-morning',{ ti:'Shake', det:['At home you can use the blender and put the banana in'], kcal:670 }),
      M('com', B?'14:00':'13:30','',{ ti:'Free meal', det:[] }, true),
      M('mer', B?'17:30':'15:30', B?'At home':'Before the squad meet-up',{ ti:'Yoghurt and fruit', det:['Light', ].concat(B?[]:['The match is at 18:45']), kcal:250 }),
      M('cen','21:00','',{ ti:'Dinner out', det:[] }, true)
    ];
    case 0: return B ? [
      M('des','09:00','',{ ti:'Free meal', det:[] }, true),
      M('bat','11:00','At home',{ ti:'Shake', det:['Before you leave'], kcal:670 }),
      M('com','12:30','At home',{ ti:'Lunch at home', det:['About three hours before the match'] }, true),
      M('mer','16:00','On the bus',{ ti:'Banana and nuts', det:['In your rucksack for the journey'], kcal:300 }),
      M('cen','21:00','When you get back', cena('rice', ['From the rice you cooked on Saturday']))
    ] : [
      M('des','09:30','',{ ti:'Free meal', det:[] }, true),
      M('bat','12:30','After the gym',{ ti:'Shake', det:['At home you can use the blender and put the banana in'], kcal:670 }),
      M('com','14:00','At home',{ ti:'Lunch at home', det:['Whatever’s cooked at home, which already has carbs'] }, true),
      M('mer','17:00','At home',{ ti:'Greek yoghurt and nuts', det:[], kcal:350 }),
      M('cen','19:45','At home',{ ti:'Freshly made chicken and rice', det:['From this afternoon’s batch cook, with veg'], kcal:850 })
    ];
  }
}

// ═══ ESTADO Y DATOS ═════════════════════════════════════════
const st = { vista:'menu', dia:pd(HOY).getDay(), partido:'sab', shop:[], foco:null };

function setSync(c){ document.getElementById('sync').className = 'dot '+c; }
function sb(method, path, body, prefer){
  const h = { apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' };
  if(prefer) h.Prefer = prefer;
  return fetch(SB_URL+'/rest/v1/'+path, { method, headers:h, body: body ? JSON.stringify(body) : undefined })
    .then(r => r.ok ? r.text().then(t => t ? JSON.parse(t) : null) : r.text().then(t => { throw new Error(r.status+' '+t); }));
}
async function cargar(){
  setSync('syncing');
  try{
    const [w, s] = await Promise.all([
      sb('GET','tracker_weeks?select=match_day&week_start=eq.'+LUNES).catch(() => []),
      sb('GET','shopping_items?select=*&week_key=eq.'+LUNES+'&order=created_at.asc')
    ]);
    if(w && w[0]) st.partido = w[0].match_day;
    st.shop = s || [];
    setSync('ok');
  }catch(e){ console.error(e); setSync('err'); }
}

// ═══ MENÚ ═══════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function pintarMenu(){
  const B = st.partido==='dom';
  const v = $('v-menu');
  // Botones de día (semana actual, de lunes a domingo)
  let h = '<div class="days">';
  for(let i=0;i<7;i++){
    const s = add(LUNES,i), d = pd(s), dw = d.getDay();
    h += '<button data-d="'+dw+'" class="'+(dw===st.dia?'on ':'')+(s===HOY?'hoy':'')+'"><span class="l">'+CORTO[dw]+'</span><span class="n">'+d.getDate()+'</span></button>';
  }
  h += '</div>';

  const comidas = menu(st.dia, B);
  const conKcal = comidas.filter(c => !c.libre && c.kcal);
  const total = conKcal.reduce((a,c) => a+c.kcal, 0);
  const hayLibres = comidas.some(c => c.libre);

  // Resumen con la barra del día
  h += '<div class="sum"><div class="top"><div class="big">≈ '+kfmt(total)+'<small>kcal'+(hayLibres?' + free meals':'')+'</small></div>'+
       '<div class="obj">Target<br><b style="color:var(--ink)">'+kfmt(OBJETIVO)+'</b></div></div>';
  if(B && (st.dia===4 || st.dia===5 || st.dia===6 || st.dia===0)) h += '<span class="tag">Sunday match week</span>';
  if(st.dia===2) h += '<span class="tag">Gym and fitness coach: double session</span>';
  if(st.dia===4) h += '<span class="tag">Futsal and football: the day you burn the most</span>';
  h += '<div class="bar" id="bar">';
  comidas.forEach((c,i) => {
    if(c.libre || !c.kcal) return;
    h += '<i data-i="'+i+'" style="width:calc('+(c.kcal/ESCALA*100)+'% - 2px);background:'+TIPO[c.tipo].col+'" title="'+TIPO[c.tipo].nom+' · '+kfmt(c.kcal)+' kcal"></i>';
  });
  h += '<span class="tick" style="left:'+(OBJETIVO/ESCALA*100)+'%"></span></div>';
  h += '<div class="scale"><span style="left:'+(OBJETIVO/ESCALA*100)+'%">target</span></div>';
  h += '<div class="legend">'+conKcal.map(c => '<span><i style="background:'+TIPO[c.tipo].col+'"></i>'+TIPO[c.tipo].nom+(comidas.filter(x=>x.tipo===c.tipo&&!x.libre).length>1 ? ' '+c.hora : '')+' <b>'+kfmt(c.kcal)+'</b></span>').join('')+'</div>';
  h += '<div class="tip">It’s an estimate so you can see where the calories come from. Tuesday’s weigh-in is what counts.</div></div>';

  // Tarjetas de comida
  comidas.forEach((c,i) => {
    const t = TIPO[c.tipo];
    h += '<div class="meal'+(c.libre?' libre':'')+'" id="m'+i+'">'+
      '<div class="ic" style="background:color-mix(in srgb, '+t.col+' 18%, transparent)">'+(c.ic||t.ic)+'</div>'+
      '<div class="bd"><div class="r1"><span class="ty" style="color:'+t.col+'">'+t.nom+' · '+c.hora+'</span>'+
      (c.kcal && !c.libre ? '<span class="kc">≈ '+kfmt(c.kcal)+' kcal</span>' : '')+'</div>'+
      '<div class="ti">'+esc(c.ti)+'</div>'+(c.donde?'<div class="wh">'+esc(c.donde)+'</div>':'')+
      (c.det && c.det.length ? '<ul>'+c.det.map(x => '<li>'+esc(x)+'</li>').join('')+'</ul>' : '')+
      '</div></div>';
  });

  // Aviso de tanda
  const tanda = (st.dia===0 && !B) || (st.dia===6 && B) ? 'domingo' : st.dia===2 ? 'martes' : null;
  if(tanda) h += '<div class="card hoytoca" style="margin-top:12px"><h2>'+(tanda==='domingo'?'Big batch cook':'Tuesday batch')+' today</h2><p>'+(tanda==='domingo'?'At 18:00, about 90 minutes.':'At 20:30, back from the fitness coach: about 40 minutes, while you have dinner.')+' The steps are in the <b>Cooking</b> tab.</p></div>';

  v.innerHTML = h;
  v.querySelectorAll('.days button').forEach(b => b.onclick = () => { st.dia = +b.dataset.d; pintarMenu(); });
  // Tocar un tramo de la barra resalta su comida
  v.querySelectorAll('#bar i').forEach(seg => seg.onclick = () => {
    const i = seg.dataset.i, bar = $('bar'), activo = seg.classList.contains('f');
    bar.querySelectorAll('i').forEach(x => x.classList.remove('f'));
    v.querySelectorAll('.meal').forEach(x => x.classList.remove('f'));
    if(activo){ bar.classList.remove('focus'); return; }
    bar.classList.add('focus'); seg.classList.add('f');
    const m = $('m'+i); m.classList.add('f'); m.scrollIntoView({ behavior:'smooth', block:'center' });
  });
}

// ═══ COCINA ═════════════════════════════════════════════════
function pintarCocina(){

  const hoyGrande = (d===0 && !B) || (d===6 && B), hoyMartes = d===2;
  const step = (t, x, k) => '<div class="st'+(k?' k':'')+'"><span class="t">'+t+'</span><span class="x">'+x+'</span></div>';
  let h = '';

  h += '<div class="card'+(hoyGrande?' hoytoca':'')+'"><h2>Big batch cook'+(hoyGrande?'<span class="badge">Today</span>':'')+'</h2>'+
    '<div class="meta">Sunday at 18:00 · about 90 min'+(B?' · moved to Saturday this week':'')+'</div>'+
    '<div class="need"><b>What goes in:</b> 600 g of rice, 4 chicken breasts, 1.2 kg of potatoes, veg (one broccoli, 2 peppers, 2 courgettes, 2 onions), a plain yoghurt for the sauce and 3 ciabattas for the sandwiches.</div>'+
    '<div class="steps">'+
      step('0:00','Oven to 200°C. Potato wedges on a tray with oil and salt')+
      step('0:10','Potatoes in, 45 min. Big pot of water on the hob')+
      step('0:15','Rice into the water, 18 min. Meanwhile, chop all the veg')+
      step('0:33','Drain the rice and spread it on a tray so it cools quickly',1)+
      step('0:35','Sauté the veg with oil and salt, 12 min')+
      step('0:47','The 4 chicken breasts on the griddle, in two batches')+
      step('1:00','Potatoes out of the oven')+
      step('1:05','Sauces: yoghurt with garlic, lemon and salt · 3 parts soy to 1 honey, 2 min on the heat')+
      step('1:10','Split into lunchboxes (below)',1)+
      step('1:15','Five sandwiches: half a ciabatta, oil, cured meat and cheese. Wrap tightly in cling film and into the freezer',1)+
      step('1:25','Wash up. Today, not tomorrow')+
    '</div>'+
    '<div class="rep">'+
      '<span class="d">Mon</span><span class="v">Rice + chicken + veg · yoghurt sauce</span>'+
      '<span class="d">Tue</span><span class="v">Rice + chicken + veg · soy and honey sauce</span>'+
      '<span class="d">Wed</span><span class="v">Chicken + potatoes + veg</span>'+
      '<span class="d">Dinners</span><span class="v">Potatoes for Monday, rice for Tuesday. The leftover chicken and rice, for tonight’s dinner</span>'+
      '<span class="d">Sandwiches</span><span class="v">Serrano on Monday, Wednesday and Friday · lomo on Tuesday and Thursday</span>'+
    '</div></div>';

  h += '<div class="card'+(hoyMartes?' hoytoca':'')+'"><h2>Tuesday batch'+(hoyMartes?'<span class="badge">Today</span>':'')+'</h2>'+
    '<div class="meta">Tuesday at 20:30, back from the fitness coach · about 40 min, while you have dinner</div>'+
    '<div class="need"><b>What goes in:</b> 500 g of pasta, 500 g of mince, a jar of tomato sauce, an onion, 600 g of potatoes and veg.</div>'+
    '<div class="steps">'+
      step('0:00','Oven to 200°C with the potato wedges. Water on to boil')+
      step('0:05','Chopped onion into the frying pan. Once it’s golden, the mince')+
      step('0:10','Pasta into the water, 11 min')+
      step('0:15','Tomato sauce and paprika into the meat. 10 min on a low heat')+
      step('0:21','Drain the pasta, a splash of oil so it doesn’t stick',1)+
      step('0:25','Veg into the frying pan, 10 min')+
      step('0:35','Potatoes out and split into lunchboxes',1)+
    '</div>'+
    '<div class="rep">'+
      '<span class="d">Thu</span><span class="v">Macaroni with mince · big portion</span>'+
      '<span class="d">Fri</span><span class="v">'+(B?'Macaroni with mince · full portion':'Half a portion of macaroni')+'</span>'+
      '<span class="d">Dinners</span><span class="v">Pasta for Wednesday and Friday, potatoes for Thursday</span>'+
    '</div></div>';

  h += '<div class="h3">The two non-negotiable rules</div>'+
    '<div class="card"><h2>Three days in the fridge, not one more</h2><p>Cooked rice and pasta keep for three days. With Sunday’s batch, Wednesday is cutting it fine. If something will be eaten later, freeze it in single portions and move it to the fridge the night before.</p></div>'+
    '<div class="card"><h2>Rice gets cooled fast</h2><p>Spread out on a tray and into the fridge <b>within an hour</b>. Rice left warm in the pot all afternoon is the classic way to end up with an upset stomach.</p></div>';
  $('v-cocina').innerHTML = h;
}

// ═══ COMPRA ═════════════════════════════════════════════════
const LISTA = [
  ['Meat','Chicken breast','4 pieces · about 800 g'],
  ['Meat','Mince','500 g'],
  ['Cured meats and cheese','Serrano ham','220 g · sandwiches and Thursday'],
  ['Cured meats and cheese','Cured pork loin (lomo)','120 g'],
  ['Cured meats and cheese','Cured cheese','150 g'],
  ['Dairy and eggs','Whole milk','4 L'],
  ['Dairy and eggs','Eggs','1 dozen'],
  ['Dairy and eggs','Greek yoghurt','6'],
  ['Dairy and eggs','Plain yoghurt','1 · for the sauce'],
  ['Fruit and veg','Bananas','12'],
  ['Fruit and veg','Mixed fruit','6 pieces'],
  ['Fruit and veg','Potatoes','2 kg'],
  ['Fruit and veg','Broccoli','1'],
  ['Fruit and veg','Peppers','2'],
  ['Fruit and veg','Courgettes','2'],
  ['Fruit and veg','Onions','3'],
  ['Fruit and veg','Lemon','1'],
  ['Bakery','Ciabatta','3 · on Sunday morning'],
  ['Bakery','Sliced bread or crispbread','1 pack'],
  ['Cupboard','Oat flour','500 g'],
  ['Cupboard','Rice','1 kg · lasts almost two weeks'],
  ['Cupboard','Pasta','500 g'],
  ['Cupboard','Tomato sauce','1 jar'],
  ['Cupboard','Nuts','200 g'],
  ['Cupboard','Granola','if it runs out'],
  ['Cupboard','Peanut butter, honey, soy sauce','if they run out']
];

async function cargarLista(){
  const filas = LISTA.map(([cat, nom, cant]) => ({ name: nom+' | '+cant, category: cat, checked:false, week_key: LUNES }));
  setSync('syncing');
  try{
    const r = await sb('POST','shopping_items', filas, 'return=representation');
    st.shop = r || []; setSync('ok'); pintarCompra(); toast('This week’s list is loaded');
  }catch(e){ console.error(e); setSync('err'); toast('Couldn’t load the list'); }
}
async function marcar(id){
  const it = st.shop.find(x => String(x.id)===String(id)); if(!it) return;
  it.checked = !it.checked; pintarCompra();
  setSync('syncing');
  try{ await sb('PATCH','shopping_items?id=eq.'+id, { checked: it.checked }); setSync('ok'); }
  catch(e){ console.error(e); setSync('err'); }
}
async function anadir(nom){
  const fila = { name: nom, category:'Other', checked:false, week_key: LUNES };
  setSync('syncing');
  try{ const r = await sb('POST','shopping_items', fila, 'return=representation'); st.shop.push(r[0]); setSync('ok'); pintarCompra(); }
  catch(e){ console.error(e); setSync('err'); toast('Not saved'); }
}
async function vaciar(){
  setSync('syncing');
  try{ await sb('DELETE','shopping_items?week_key=eq.'+LUNES); st.shop = []; setSync('ok'); pintarCompra(); }
  catch(e){ console.error(e); setSync('err'); }
}

function pintarCompra(){
  const v = $('v-compra'), d0 = pd(LUNES), d6 = pd(add(LUNES,6));
  const sem = 'Week from '+d0.getDate()+' '+MESES[d0.getMonth()]+' to '+d6.getDate()+' '+MESES[d6.getMonth()];
  if(!st.shop.length){
    v.innerHTML = '<div class="card"><h2>The weekly shop</h2><div class="meta">'+sem+'</div>'+
      '<p>The list comes from the menu: just what you need for the meals, shakes and sandwiches. The meat for dinners is cooked at home, so it isn’t on here.</p>'+
      '<button class="btn" id="cargar">Load this week’s list</button></div>';
    $('cargar').onclick = cargarLista;
    return;
  }
  const hechos = st.shop.filter(x => x.checked).length;
  let h = '<div class="shop-top"><b>'+sem+'</b><span>'+hechos+' of '+st.shop.length+'</span></div>'+
    '<div class="prog"><i style="width:'+(hechos/st.shop.length*100)+'%"></i></div>';
  const cats = [];
  st.shop.forEach(x => { if(!cats.includes(x.category)) cats.push(x.category); });
  cats.forEach(c => {
    h += '<div class="cat">'+esc(c)+'</div>';
    st.shop.filter(x => x.category===c).forEach(x => {
      const [nom, cant] = String(x.name).split(' | ');
      const [q1, ...resto] = (cant||'').split(' · ');
      h += '<button class="item'+(x.checked?' on':'')+'" data-id="'+x.id+'"><span class="bx">'+(x.checked?'✓':'')+'</span>'+
        '<span class="nm">'+esc(nom)+(resto.length?'<small>'+esc(resto.join(' · '))+'</small>':'')+'</span>'+
        (q1?'<span class="q">'+esc(q1)+'</span>':'')+'</button>';
    });
  });
  h += '<div class="addrow"><input id="nuevo" placeholder="Add something else" maxlength="60"><button id="add">Add</button></div>'+
       '<button class="btn ghost" id="vaciar">Start the list from scratch</button>';
  v.innerHTML = h;
  v.querySelectorAll('.item').forEach(b => b.onclick = () => marcar(b.dataset.id));
  $('add').onclick = () => { const t = $('nuevo').value.trim(); if(t) anadir(t); };
  $('nuevo').onkeydown = e => { if(e.key==='Enter') $('add').click(); };
  $('vaciar').onclick = vaciar;
}

// ═══ REGLAS ═════════════════════════════════════════════════

      '<div class="plate">'+
        '<div><span class="ic">🍗</span><b>Meat or fish</b><span>Enough to cover your palm, a finger thick</span></div>'+
        '<div><span class="ic">🍚</span><b>Half a plate of carbs</b><span>A level glass of uncooked rice, a glass and a half of macaroni or two fist-sized potatoes</span></div>'+
        '<div><span class="ic">🥦</span><b>A handful of veg</b><span>The rest of the plate</span></div>'+
        '<div><span class="ic">🫒</span><b>Oil and bread</b><span>Two tablespoons of oil, don’t be shy, and bread on the side</span></div>'+
      '</div></div>'+
    '<div class="card"><h2>Dinner</h2><p>The meat is cooked at home and it’s good. <b>Your job is the side:</b> whatever’s in the pan, you add half a plate of carbs from the fridge and bread. Dinner doesn’t fail because of the meat, it fails because of the side you didn’t add.</p></div>'+
    '<div class="card"><h2>The only dial</h2><div class="meta">Check Tuesday’s weight in the gym app</div>'+
      '<div class="knob">'+
        '<div><b>+300 to +500 g</b>Per month: change nothing</div>'+
        '<div><b>Over +500 g</b>Drop the bread at dinner</div>'+
        '<div><b>Under +300 g</b>Half a portion more carbs at dinner</div>'+
      '</div><p>That’s the only thing you change. Breakfast, the shake and the sandwich stay as they are.</p></div>'+
    '<div class="card"><h2>The shake</h2><p><b>400 ml of whole milk, 50 g of oat flour, 30 g of whey and the creatine</b>, made the night before and into the fridge. In the morning into your rucksack, and at the office back into the fridge until 11.</p><p>Milk first and powder after, or it goes lumpy. Shake, leave it a minute and shake again. Rinse it as soon as you finish. 3 to 5 g of creatine is enough.</p></div>'+
    '<div class="card"><h2>The sandwich</h2><p><b>Ciabatta or a rustic baguette</b>, bought on Sunday morning and frozen the same day. Half a loaf per sandwich, about 60 g of cured meat, a thick slice of cured cheese and a drizzle of oil.</p><p>Serrano on Mondays, Wednesdays and Fridays. Cured pork loin (lomo) on Tuesdays and Thursdays. No tomato or mayonnaise, they don’t survive the freezer. It comes out of the freezer in the morning and goes straight into the office fridge.</p></div>'+
    '<div class="card"><h2>What’s in and what’s out</h2><div class="yesno"><div class="yes"><b>Yes</b>Broccoli, pepper, courgette, onion</div><div class="no"><b>No</b>Cauliflower</div></div></div>'+
    '<div class="card"><h2>The weekend</h2><p><b>Saturday lunch and dinner</b> are free meals. <b>Sunday lunch</b> is whatever’s cooked at home, which already has carbs. The one thing you don’t skip is the shake.</p></div>';
}

// ═══ NAVEGACIÓN ═════════════════════════════════════════════
function ir(v){
  st.vista = v;
  [...$('tabs').children].forEach(b => b.classList.toggle('on', b.dataset.v===v));
  ['menu','cocina','compra','reglas'].forEach(x => $('v-'+x).classList.toggle('hide', x!==v));
  ({ menu:pintarMenu, cocina:pintarCocina, compra:pintarCompra, reglas:pintarReglas })[v]();
  window.scrollTo(0,0);
}
$('tabs').onclick = e => { const v = e.target.dataset.v; if(v) ir(v); };

let tt;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1600); }

$('sub').textContent = 'Today, '+DIAS[pd(HOY).getDay()]+' '+pd(HOY).getDate()+' '+MESES[pd(HOY).getMonth()];
ir('menu');
cargar().then(() => ir(st.vista));
</script>
