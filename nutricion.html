<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dieta">
<title>Dieta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1216; --surface:#161C22; --surface-2:#1E262E; --line:#28323C;
  --ink:#ECEFF3; --muted:#8A97A5; --faint:#5C6773;
  --ok:#4DB6A5;
  /* Una tinta por comida, en orden fijo y validadas sobre el fondo oscuro */
  --c-des:#3987e5; --c-bat:#d95926; --c-com:#199e70; --c-mer:#c98500; --c-cen:#d55181;
  --pad:16px;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 15px/1.45 "Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding:16px var(--pad) 70px}
button,input{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{background:none;border:none;padding:0;cursor:pointer}

.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.head h1{font-size:17px;font-weight:600;margin:0}
.head .sub{font-size:12.5px;color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--ok)}.dot.syncing{background:#E8A33D;animation:p 1s infinite}.dot.err{background:#E2574C}
@keyframes p{50%{opacity:.3}}

.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:16px}
.tabs button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.tabs button.on{background:var(--surface-2);color:var(--ink);font-weight:600}

/* Días */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.days button{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:7px 2px;text-align:center}
.days button .l{display:block;font-size:11px;color:var(--faint)}
.days button .n{display:block;font-size:15px;font-weight:600;margin-top:1px}
.days button.on{background:var(--ink);border-color:var(--ink)}
.days button.on .l,.days button.on .n{color:var(--bg)}
.days button.hoy:not(.on){border-color:var(--muted)}

/* Resumen del día */
.sum{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.sum .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sum .big{font-size:30px;font-weight:700;letter-spacing:-.02em}
.sum .big small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.sum .obj{font-size:12.5px;color:var(--faint);text-align:right}
.sum .tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:2px 7px;margin-top:6px}
.bar{position:relative;display:flex;gap:2px;height:14px;margin:14px 0 6px}
.bar i{display:block;height:100%;border-radius:4px;cursor:pointer;transition:opacity .15s}
.bar.focus i{opacity:.35}.bar.focus i.f{opacity:1}
.bar .tick{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:1px}
.scale{position:relative;height:16px;font-size:11px;color:var(--faint)}
.scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.legend span i{width:9px;height:9px;border-radius:3px;display:block}
.legend span b{color:var(--ink);font-weight:600}
.tip{font-size:12.5px;color:var(--faint);margin-top:10px;line-height:1.5}

/* Comidas */
.meal{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;transition:border-color .15s}
.meal.f{border-color:var(--muted)}
.meal .ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.meal .bd{flex:1;min-width:0}
.meal .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meal .ty{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.meal .kc{font-size:12.5px;color:var(--muted);white-space:nowrap}
.meal .ti{font-size:15.5px;font-weight:600;margin-top:2px;line-height:1.3}
.meal .wh{font-size:12.5px;color:var(--faint);margin-top:1px}
.meal ul{margin:6px 0 0;padding:0;list-style:none}
.meal li{font-size:13.5px;color:var(--muted);padding-left:12px;position:relative;margin-top:2px}
.meal li::before{content:"";position:absolute;left:0;top:.62em;width:4px;height:4px;border-radius:50%;background:var(--faint)}
.meal.libre{background:transparent;border-style:dashed}
.meal.libre .ti{color:var(--muted);font-weight:500}

/* Tarjetas genéricas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card h2{font-size:16px;font-weight:600;margin:0 0 2px}
.card .meta{font-size:12.5px;color:var(--faint);margin-bottom:10px}
.card p{font-size:14px;color:var(--muted);margin:8px 0 0;line-height:1.5}
.card p b{color:var(--ink);font-weight:600}
.hoytoca{border-color:var(--c-com)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--bg);background:var(--c-com);border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:2px}
.need{background:var(--bg);border-radius:11px;padding:10px 12px;font-size:13.5px;color:var(--muted);line-height:1.55}
.need b{color:var(--ink)}
.steps{margin-top:12px}
.st{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.st .t{width:38px;flex:none;font-size:13px;font-weight:600;color:var(--muted)}
.st .x{flex:1;font-size:14px;line-height:1.4}
.st.k .x{font-weight:600}
.rep{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin-top:12px;font-size:13.5px}
.rep .d{color:var(--faint);font-weight:600}
.rep .v{color:var(--muted)}
.h3{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px}

/* Reglas */
.plate{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.plate div{background:var(--bg);border-radius:12px;padding:12px}
.plate .ic{font-size:22px}
.plate b{display:block;font-size:14px;margin-top:4px}
.plate span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.yesno{display:flex;gap:8px;margin-top:10px}
.yesno div{flex:1;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.yesno div b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px}
.yes b{color:var(--ok)}.no b{color:#E2574C}
.knob{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.knob div{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:11px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.knob div b{color:var(--ink);font-weight:600;min-width:92px}

/* Compra */
.shop-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.shop-top b{font-size:15px}
.shop-top span{font-size:12.5px;color:var(--faint)}
.prog{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.cat{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:16px 0 4px}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item .bx{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--faint);flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--bg)}
.item.on .bx{background:var(--ok);border-color:var(--ok)}
.item .nm{flex:1;font-size:14.5px}
.item .nm small{display:block;font-size:12px;color:var(--faint)}
.item .q{font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.item.on .nm,.item.on .q{color:var(--faint);text-decoration:line-through}
.addrow{display:flex;gap:8px;margin-top:16px}
.addrow input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14.5px;outline:none}
.addrow button,.btn{background:var(--ink);color:var(--bg);font-weight:600;border-radius:11px;padding:11px 16px;font-size:14.5px}
.btn{width:100%;padding:14px;margin-top:6px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--muted);margin-top:10px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;transition:.2s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div><h1>Dieta</h1><div class="sub" id="sub"></div></div>
    <span class="dot" id="sync"></span>
  </div>

  <div class="tabs" id="tabs">
    <button data-v="menu" class="on">Menú</button>
    <button data-v="cocina">Cocina</button>
    <button data-v="compra">Compra</button>
    <button data-v="reglas">Reglas</button>
  </div>

  <section id="v-menu"></section>
  <section id="v-cocina" class="hide"></section>
  <section id="v-compra" class="hide"></section>
  <section id="v-reglas" class="hide"></section>
</div>
<div class="toast" id="toast"></div>

<script>
// ═══ CONFIGURACIÓN ══════════════════════════════════════════
const SB_URL = 'https://jqmfbodxyidnwnvqfjfh.supabase.co';
const SB_KEY = 'sb_publishable_VzI9uNGpvzXuK3ZIodJCNw_H39Ri-ey';
const OBJETIVO = 3400;   // kcal al día
const ESCALA = 4200;     // tope de la barra

// ═══ FECHAS ═════════════════════════════════════════════════
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const CORTO = ['D','L','M','X','J','V','S'];
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const ds = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const add = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
const q = new URLSearchParams(location.search).get('hoy');   // ?hoy=2026-10-06 para probar
const HOY = q && /^\d{4}-\d{2}-\d{2}$/.test(q) ? q : ds(new Date());
const LUNES = add(HOY, -((pd(HOY).getDay()+6)%7));
const kfmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

// ═══ COMIDAS ════════════════════════════════════════════════
const TIPO = {
  des:{ nom:'Desayuno', ic:'🥣', col:'var(--c-des)' },
  bat:{ nom:'Batido',   ic:'🥤', col:'var(--c-bat)' },
  com:{ nom:'Comida',   ic:'🍱', col:'var(--c-com)' },
  mer:{ nom:'Merienda', ic:'🥖', col:'var(--c-mer)' },
  cen:{ nom:'Cena',     ic:'🍽️', col:'var(--c-cen)' }
};

const DES = {
  avena:   { ti:'Avena', det:['40 g de avena con 300 ml de leche entera','Un plátano y una cucharada de crema de cacahuete'], kcal:540 },
  huevos:  { ti:'Huevos revueltos', det:['Tres huevos y dos tostadas con aceite','Una pieza de fruta'], kcal:520 },
  yogur:   { ti:'Yogur griego', det:['Dos yogures griegos con granola, miel y nueces','Una tostada con jamón'], kcal:600 },
  tortitas:{ ti:'Tortitas', det:['40 g de avena, dos huevos y un plátano a la batidora y a la sartén','Con miel y crema de cacahuete'], kcal:520 }
};
const BATIDO_DET = ['Hecho la noche antes: 400 ml de leche entera, 50 g de avena en polvo, 30 g de whey y la creatina','El plátano, entero y aparte'];
const bocadillo = relleno => ({ ti:'Bocadillo de '+relleno+' y queso', det:['Media chapata del congelador, con un chorrito de aceite','Un puñado pequeño de frutos secos al lado'], kcal:700 });
const cena = (guarn, extra) => ({ ti:'Carne de casa + '+guarn, det:['La carne la pone la casa: tú pones medio plato de '+guarn+' y pan'].concat(extra||[]), kcal:800 });

// Cada día: lista de comidas. B = semana con partido el domingo.
function menu(dow, B){
  const M = (tipo, hora, donde, o, libre) => Object.assign({ tipo, hora, donde, libre:!!libre }, o);
  const batOficina = M('bat','11:00','En la oficina',{ ti:'Batido + plátano', det:BATIDO_DET, kcal:670 });
  switch(dow){
    case 1: return [
      M('des','07:00','En casa', DES.avena),
      batOficina,
      M('com','13:45','En el trabajo',{ ti:'Arroz con pollo y verdura', det:['Táper de la tanda del domingo','Con la salsa de yogur y ajo'], kcal:950 }),
      M('mer','18:00','En el descanso de clase', bocadillo('jamón serrano')),
      M('cen','21:30','En casa', cena('patata asada'))
    ];
    case 2: return [
      M('des','07:00','En casa', DES.huevos),
      batOficina,
      M('com','14:30','En el gimnasio',{ ti:'Arroz con pollo y verdura', det:['Táper de la tanda del domingo','Con la salsa de soja y miel'], kcal:950 }),
      M('mer','16:30','Al salir del gimnasio', bocadillo('lomo embuchado')),
      M('cen','19:00','En casa, durante la tanda', cena('arroz'))
    ];
    case 3: return [
      M('des','07:00','En casa', DES.avena),
      batOficina,
      M('com','13:45','En el trabajo',{ ti:'Pollo con patata asada y verdura', det:['Último táper de la tanda del domingo'], kcal:850 }),
      M('mer','18:00','En el descanso de clase', bocadillo('jamón serrano')),
      M('cen','21:45','En casa', cena('pasta', ['Esta noche, los dos táperes del jueves']))
    ];
    case 4: return [
      M('des','07:00','En casa', DES.yogur),
      batOficina,
      M('com','13:45','En el trabajo',{ ti:'Comida ligera', det:['Fruta y pan con jamón','A las 15:00 hay futsal: hoy no toca plato'], kcal:360 }),
      M('com','16:30','Al volver del futsal',{ ti:'Macarrones con carne picada', det:['El segundo táper, de la tanda del martes'], kcal:850 }),
      M('mer', B?'19:30':'18:30', B?'Al salir del gimnasio':'Antes del entreno', bocadillo('lomo embuchado')),
      M('cen', B?'21:00':'21:45','En casa', cena('patata asada'))
    ];
    case 5: return [
      M('des','07:00','En casa', DES.huevos),
      B ? batOficina : M('bat','11:00','En la oficina',{ ti:'Batido + plátano + yogur griego', det:['El batido de siempre y un yogur','Hoy la comida es ligera, así que la media mañana va más cargada'], kcal:770 }),
      B ? M('com','14:30','En casa',{ ti:'Macarrones con carne picada', det:['Ración entera: esta tarde no hay gimnasio'], kcal:850 })
        : M('com','14:30','En casa',{ ti:'Media ración de macarrones', det:['De la tanda del martes','En 45 minutos hay gimnasio'], kcal:450 }),
      M('mer', B?'19:00':'16:40', B?'Al salir de clase':'De camino a clase', bocadillo('jamón serrano')),
      B ? M('cen','21:45','En casa', cena('pasta'))
        : M('cen','19:45','En casa',{ ti:'Cena grande: carne + plato lleno de pasta', det:['Hoy es la comida fuerte del día','Plato lleno, no medio, y pan'], kcal:1000 })
    ];
    case 6: return [
      M('des','09:00','En casa', DES.tortitas),
      M('bat', B?'12:30':'11:30', B?'Después del gimnasio':'A media mañana',{ ti:'Batido', det:['En casa puedes usar batidora y meter el plátano dentro'], kcal:670 }),
      M('com', B?'14:00':'13:30','',{ ti:'Comida libre', det:[] }, true),
      M('mer', B?'17:30':'15:30', B?'En casa':'Antes de la convocatoria',{ ti:'Yogur y fruta', det:['Ligero', ].concat(B?[]:['El partido es a las 18:45']), kcal:250 }),
      M('cen','21:00','',{ ti:'Cena fuera', det:[] }, true)
    ];
    case 0: return B ? [
      M('des','09:00','',{ ti:'Desayuno libre', det:[] }, true),
      M('bat','11:00','En casa',{ ti:'Batido', det:['Antes de salir'], kcal:670 }),
      M('com','12:30','En casa',{ ti:'Comida en casa', det:['Unas tres horas antes del partido'] }, true),
      M('mer','16:00','En el bus',{ ti:'Plátano y frutos secos', det:['En la mochila para el viaje'], kcal:300 }),
      M('cen','21:00','Al llegar', cena('arroz', ['Del arroz que cocinaste el sábado']))
    ] : [
      M('des','09:30','',{ ti:'Desayuno libre', det:[] }, true),
      M('bat','12:30','Después del gimnasio',{ ti:'Batido', det:['En casa puedes usar batidora y meter el plátano dentro'], kcal:670 }),
      M('com','14:00','En casa',{ ti:'Comida en casa', det:['Lo que se cocine en casa, que ya lleva hidratos'] }, true),
      M('mer','17:00','En casa',{ ti:'Yogur griego y frutos secos', det:[], kcal:350 }),
      M('cen','19:45','En casa',{ ti:'Pollo y arroz recién hechos', det:['De la tanda de esta tarde, con verdura'], kcal:850 })
    ];
  }
}

// ═══ ESTADO Y DATOS ═════════════════════════════════════════
const st = { vista:'menu', dia:pd(HOY).getDay(), partido:'sab', shop:[], foco:null };

function setSync(c){ document.getElementById('sync').className = 'dot '+c; }
function sb(method, path, body, prefer){
  const h = { apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' };
  if(prefer) h.Prefer = prefer;
  return fetch(SB_URL+'/rest/v1/'+path, { method, headers:h, body: body ? JSON.stringify(body) : undefined })
    .then(r => r.ok ? r.text().then(t => t ? JSON.parse(t) : null) : r.text().then(t => { throw new Error(r.status+' '+t); }));
}
async function cargar(){
  setSync('syncing');
  try{
    const [w, s] = await Promise.all([
      sb('GET','tracker_weeks?select=match_day&week_start=eq.'+LUNES).catch(() => []),
      sb('GET','shopping_items?select=*&week_key=eq.'+LUNES+'&order=created_at.asc')
    ]);
    if(w && w[0]) st.partido = w[0].match_day;
    st.shop = s || [];
    setSync('ok');
  }catch(e){ console.error(e); setSync('err'); }
}

// ═══ MENÚ ═══════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function pintarMenu(){
  const B = st.partido==='dom';
  const v = $('v-menu');
  // Botones de día (semana actual, de lunes a domingo)
  let h = '<div class="days">';
  for(let i=0;i<7;i++){
    const s = add(LUNES,i), d = pd(s), dw = d.getDay();
    h += '<button data-d="'+dw+'" class="'+(dw===st.dia?'on ':'')+(s===HOY?'hoy':'')+'"><span class="l">'+CORTO[dw]+'</span><span class="n">'+d.getDate()+'</span></button>';
  }
  h += '</div>';

  const comidas = menu(st.dia, B);
  const conKcal = comidas.filter(c => !c.libre && c.kcal);
  const total = conKcal.reduce((a,c) => a+c.kcal, 0);
  const hayLibres = comidas.some(c => c.libre);

  // Resumen con la barra del día
  h += '<div class="sum"><div class="top"><div class="big">≈ '+kfmt(total)+'<small>kcal'+(hayLibres?' + libres':'')+'</small></div>'+
       '<div class="obj">Objetivo<br><b style="color:var(--ink)">'+kfmt(OBJETIVO)+'</b></div></div>';
  if(B && (st.dia===4 || st.dia===5 || st.dia===6 || st.dia===0)) h += '<span class="tag">Semana con partido el domingo</span>';
  if(st.dia===4) h += '<span class="tag">Futsal y fútbol: el día que más gastas</span>';
  h += '<div class="bar" id="bar">';
  comidas.forEach((c,i) => {
    if(c.libre || !c.kcal) return;
    h += '<i data-i="'+i+'" style="width:calc('+(c.kcal/ESCALA*100)+'% - 2px);background:'+TIPO[c.tipo].col+'" title="'+TIPO[c.tipo].nom+' · '+c.kcal+' kcal"></i>';
  });
  h += '<span class="tick" style="left:'+(OBJETIVO/ESCALA*100)+'%"></span></div>';
  h += '<div class="scale"><span style="left:'+(OBJETIVO/ESCALA*100)+'%">objetivo</span></div>';
  h += '<div class="legend">'+conKcal.map(c => '<span><i style="background:'+TIPO[c.tipo].col+'"></i>'+TIPO[c.tipo].nom+(c.tipo==='com' && comidas.filter(x=>x.tipo==='com'&&!x.libre).length>1 ? ' '+c.hora : '')+' <b>'+c.kcal+'</b></span>').join('')+'</div>';
  h += '<div class="tip">Es una estimación para que veas de dónde salen las calorías. La que manda es la báscula del martes.</div></div>';

  // Tarjetas de comida
  comidas.forEach((c,i) => {
    const t = TIPO[c.tipo];
    h += '<div class="meal'+(c.libre?' libre':'')+'" id="m'+i+'">'+
      '<div class="ic" style="background:color-mix(in srgb, '+t.col+' 18%, transparent)">'+t.ic+'</div>'+
      '<div class="bd"><div class="r1"><span class="ty" style="color:'+t.col+'">'+t.nom+' · '+c.hora+'</span>'+
      (c.kcal && !c.libre ? '<span class="kc">≈ '+c.kcal+' kcal</span>' : '')+'</div>'+
      '<div class="ti">'+esc(c.ti)+'</div>'+(c.donde?'<div class="wh">'+esc(c.donde)+'</div>':'')+
      (c.det && c.det.length ? '<ul>'+c.det.map(x => '<li>'+esc(x)+'</li>').join('')+'</ul>' : '')+
      '</div></div>';
  });

  // Aviso de tanda
  const tanda = (st.dia===0 && !B) || (st.dia===6 && B) ? 'domingo' : st.dia===2 ? 'martes' : null;
  if(tanda) h += '<div class="card hoytoca" style="margin-top:12px"><h2>Hoy toca tanda'+(tanda==='domingo'?' grande':'')+'</h2><p>'+(tanda==='domingo'?'A las 18:00, unos 90 minutos.':'A las 19:00, unos 40 minutos, mientras cenas.')+' Los pasos están en la pestaña <b>Cocina</b>.</p></div>';

  v.innerHTML = h;
  v.querySelectorAll('.days button').forEach(b => b.onclick = () => { st.dia = +b.dataset.d; pintarMenu(); });
  // Tocar un tramo de la barra resalta su comida
  v.querySelectorAll('#bar i').forEach(seg => seg.onclick = () => {
    const i = seg.dataset.i, bar = $('bar'), activo = seg.classList.contains('f');
    bar.querySelectorAll('i').forEach(x => x.classList.remove('f'));
    v.querySelectorAll('.meal').forEach(x => x.classList.remove('f'));
    if(activo){ bar.classList.remove('focus'); return; }
    bar.classList.add('focus'); seg.classList.add('f');
    const m = $('m'+i); m.classList.add('f'); m.scrollIntoView({ behavior:'smooth', block:'center' });
  });
}

// ═══ COCINA ═════════════════════════════════════════════════

    '<div class="meta">Domingo a las 18:00 · unos 90 min'+(B?' · esta semana pasa al sábado':'')+'</div>'+
    '<div class="need"><b>Lo que entra:</b> 600 g de arroz, 4 pechugas, 1,2 kg de patatas, verdura (un brócoli, 2 pimientos, 2 calabacines, 2 cebollas), un yogur natural para la salsa y 3 chapatas para los bocadillos.</div>'+
    '<div class="steps">'+
      step('0:00','Horno a 200º. Patatas en gajos, en bandeja con aceite y sal')+
      step('0:10','Patatas dentro, 45 min. Olla grande con agua al fuego')+
      step('0:15','Arroz al agua, 18 min. Mientras, cortas toda la verdura')+
      step('0:33','Escurres el arroz y lo extiendes en una bandeja para que enfríe rápido',1)+
      step('0:35','Verdura salteada con aceite y sal, 12 min')+
      step('0:47','Las 4 pechugas a la plancha, en dos tandas')+
      step('1:00','Patatas fuera del horno')+
      step('1:05','Salsas: yogur con ajo, limón y sal · 3 de soja por 1 de miel, 2 min al fuego')+
      step('1:10','Reparto en táperes (abajo)',1)+
      step('1:15','Cinco bocadillos: media chapata, aceite, embutido y queso. Film bien apretado y al congelador',1)+
      step('1:25','Fregar. Hoy, no mañana')+
    '</div>'+
    '<div class="rep">'+
      '<span class="d">Lun</span><span class="v">Arroz + pollo + verdura · salsa de yogur</span>'+
      '<span class="d">Mar</span><span class="v">Arroz + pollo + verdura · salsa de soja</span>'+
      '<span class="d">Mié</span><span class="v">Pollo + patata + verdura</span>'+
      '<span class="d">Cenas</span><span class="v">Patata para el lunes, arroz para el martes. El pollo y arroz que sobran, para la cena de hoy</span>'+
      '<span class="d">Bocatas</span><span class="v">Serrano lunes, miércoles y viernes · lomo martes y jueves</span>'+
    '</div></div>';

  h += '<div class="card'+(hoyMartes?' hoytoca':'')+'"><h2>Tanda del martes'+(hoyMartes?'<span class="badge">Hoy</span>':'')+'</h2>'+
    '<div class="meta">Martes a las 19:00 · unos 40 min, mientras cenas</div>'+
    '<div class="need"><b>Lo que entra:</b> 500 g de pasta, 500 g de carne picada, un bote de tomate frito, una cebolla, 600 g de patatas y verdura.</div>'+
    '<div class="steps">'+
      step('0:00','Horno a 200º con las patatas en gajos. Agua a hervir')+
      step('0:05','Cebolla picada a la sartén. Cuando esté dorada, la carne picada')+
      step('0:10','Pasta al agua, 11 min')+
      step('0:15','A la carne, el tomate frito y pimentón. 10 min a fuego bajo')+
      step('0:21','Escurres la pasta, un chorro de aceite para que no se pegue',1)+
      step('0:25','Verdura a la sartén, 10 min')+
      step('0:35','Patatas fuera y reparto en táperes',1)+
    '</div>'+
    '<div class="rep">'+
      '<span class="d">Jue</span><span class="v">Macarrones con carne · ración grande</span>'+
      '<span class="d">Vie</span><span class="v">'+(B?'Macarrones con carne · ración entera':'Media ración de macarrones')+'</span>'+
      '<span class="d">Cenas</span><span class="v">Pasta para el miércoles y el viernes, patata para el jueves</span>'+
    '</div></div>';

  h += '<div class="h3">Las dos reglas que no se negocian</div>'+
    '<div class="card"><h2>Tres días en la nevera, ni uno más</h2><p>El arroz y la pasta cocidos aguantan tres días. De la tanda del domingo, el miércoles va justo. Si algo se va a comer más tarde, al congelador en ración suelta y se baja a la nevera la noche antes.</p></div>'+

// ═══ COMPRA ═════════════════════════════════════════════════
const LISTA = [
  ['Carne','Pechuga de pollo','4 piezas · unos 800 g'],
  ['Carne','Carne picada','500 g'],
  ['Embutido y queso','Jamón serrano','220 g · bocadillos y jueves'],
  ['Embutido y queso','Lomo embuchado','120 g'],
  ['Embutido y queso','Queso curado','150 g'],
  ['Lácteos y huevos','Leche entera','4 L'],
  ['Lácteos y huevos','Huevos','1 docena'],
  ['Lácteos y huevos','Yogur griego','6'],
  ['Lácteos y huevos','Yogur natural','1 · para la salsa'],
  ['Fruta y verdura','Plátanos','12'],
  ['Fruta y verdura','Fruta variada','6 piezas'],
  ['Fruta y verdura','Patatas','2 kg'],
  ['Fruta y verdura','Brócoli','1'],
  ['Fruta y verdura','Pimientos','2'],
  ['Fruta y verdura','Calabacines','2'],
  ['Fruta y verdura','Cebollas','3'],
  ['Fruta y verdura','Limón','1'],
  ['Panadería','Chapata','3 · el domingo por la mañana'],
  ['Panadería','Pan de molde o tostadas','1 paquete'],
  ['Despensa','Avena en polvo','500 g'],
  ['Despensa','Arroz','1 kg · dura casi dos semanas'],
  ['Despensa','Pasta','500 g'],
  ['Despensa','Tomate frito','1 bote'],
  ['Despensa','Frutos secos','200 g'],
  ['Despensa','Granola','si se acaba'],
  ['Despensa','Crema de cacahuete, miel, soja','si se acaban']
];

async function cargarLista(){
  const filas = LISTA.map(([cat, nom, cant]) => ({ name: nom+' | '+cant, category: cat, checked:false, week_key: LUNES }));
  setSync('syncing');
  try{
    const r = await sb('POST','shopping_items', filas, 'return=representation');
    st.shop = r || []; setSync('ok'); pintarCompra(); toast('Lista de la semana cargada');
  }catch(e){ console.error(e); setSync('err'); toast('No se ha podido cargar'); }
}
async function marcar(id){
  const it = st.shop.find(x => String(x.id)===String(id)); if(!it) return;
  it.checked = !it.checked; pintarCompra();
  setSync('syncing');
  try{ await sb('PATCH','shopping_items?id=eq.'+id, { checked: it.checked }); setSync('ok'); }
  catch(e){ console.error(e); setSync('err'); }
}
async function anadir(nom){
  const fila = { name: nom, category:'Otros', checked:false, week_key: LUNES };
  setSync('syncing');
  try{ const r = await sb('POST','shopping_items', fila, 'return=representation'); st.shop.push(r[0]); setSync('ok'); pintarCompra(); }
  catch(e){ console.error(e); setSync('err'); toast('No se ha guardado'); }
}
async function vaciar(){
  setSync('syncing');
  try{ await sb('DELETE','shopping_items?week_key=eq.'+LUNES); st.shop = []; setSync('ok'); pintarCompra(); }
  catch(e){ console.error(e); setSync('err'); }
}

function pintarCompra(){
  const v = $('v-compra'), d0 = pd(LUNES), d6 = pd(add(LUNES,6));
  const sem = 'Semana del '+d0.getDate()+' '+MESES[d0.getMonth()]+' al '+d6.getDate()+' '+MESES[d6.getMonth()];
  if(!st.shop.length){
    v.innerHTML = '<div class="card"><h2>Compra de la semana</h2><div class="meta">'+sem+'</div>'+
      '<p>La lista sale del menú: lo justo para las comidas, los batidos y los bocadillos. La carne de las cenas la pone la casa y no está aquí.</p>'+
      '<button class="btn" id="cargar">Cargar la lista de esta semana</button></div>';
    $('cargar').onclick = cargarLista;
    return;
  }
  const hechos = st.shop.filter(x => x.checked).length;
  let h = '<div class="shop-top"><b>'+sem+'</b><span>'+hechos+' de '+st.shop.length+'</span></div>'+
    '<div class="prog"><i style="width:'+(hechos/st.shop.length*100)+'%"></i></div>';
  const cats = [];
  st.shop.forEach(x => { if(!cats.includes(x.category)) cats.push(x.category); });
  cats.forEach(c => {
    h += '<div class="cat">'+esc(c)+'</div>';
    st.shop.filter(x => x.category===c).forEach(x => {
      const [nom, cant] = String(x.name).split(' | ');
      const [q1, ...resto] = (cant||'').split(' · ');
      h += '<button class="item'+(x.checked?' on':'')+'" data-id="'+x.id+'"><span class="bx">'+(x.checked?'✓':'')+'</span>'+
        '<span class="nm">'+esc(nom)+(resto.length?'<small>'+esc(resto.join(' · '))+'</small>':'')+'</span>'+
        (q1?'<span class="q">'+esc(q1)+'</span>':'')+'</button>';
    });
  });
  h += '<div class="addrow"><input id="nuevo" placeholder="Añadir algo más" maxlength="60"><button id="add">Añadir</button></div>'+
       '<button class="btn ghost" id="vaciar">Empezar la lista de cero</button>';
  v.innerHTML = h;
  v.querySelectorAll('.item').forEach(b => b.onclick = () => marcar(b.dataset.id));
  $('add').onclick = () => { const t = $('nuevo').value.trim(); if(t) anadir(t); };
  $('nuevo').onkeydown = e => { if(e.key==='Enter') $('add').click(); };
  $('vaciar').onclick = vaciar;
}

    '<div class="card"><h2>El fin de semana</h2><p>La <b>comida y la cena del sábado</b> son libres. La <b>comida del domingo</b> es la de casa, que ya lleva hidratos. Lo que no se salta es el batido.</p></div>';
}

// ═══ NAVEGACIÓN ═════════════════════════════════════════════
function ir(v){
  st.vista = v;
  [...$('tabs').children].forEach(b => b.classList.toggle('on', b.dataset.v===v));
  ['menu','cocina','compra','reglas'].forEach(x => $('v-'+x).classList.toggle('hide', x!==v));
  ({ menu:pintarMenu, cocina:pintarCocina, compra:pintarCompra, reglas:pintarReglas })[v]();
  window.scrollTo(0,0);
}
$('tabs').onclick = e => { const v = e.target.dataset.v; if(v) ir(v); };

let tt;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1600); }

$('sub').textContent = 'Hoy, '+DIAS[pd(HOY).getDay()]+' '+pd(HOY).getDate()+' '+MESES[pd(HOY).getMonth()];
ir('menu');
cargar().then(() => ir(st.vista));
</script>
