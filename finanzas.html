<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Control 300">
<title>Control 300</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1216;
  --surface:#161C22;
  --surface-2:#1E262E;
  --line:#28323C;
  --ink:#ECEFF3;
  --muted:#8A97A5;
  --faint:#5C6773;
  --ocio:#E8A33D;
  --comida:#4DB6A5;
  --mensual:#8C7BE0;
  --over:#E2574C;
  --pad:16px;
  --r:14px;
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 16px/1.45 "Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums;
}
.wrap{max-width:520px;margin:0 auto;padding:18px var(--pad) 130px}
button,input{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ocio);outline-offset:2px}
.hide{display:none !important}

.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:16px}
.head h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
.head .when{font-size:13px;color:var(--muted)}

.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:20px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface-2);color:var(--ink);font-weight:600}

.hero{margin-bottom:22px}
.hero .lab{font-size:14px;color:var(--muted);margin-bottom:2px}
.hero .amt{font-size:52px;font-weight:700;letter-spacing:-.035em;line-height:1.05}
.hero .amt.over{color:var(--over)}
.hero .sub{font-size:13px;color:var(--faint);margin-top:4px}

.bolsa{padding:14px 0;border-top:1px solid var(--line)}
.bolsa .r1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.bolsa .nm{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.bolsa .nm i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.bolsa .val{font-size:15px;font-weight:600}
.bolsa .r2{display:flex;justify-content:space-between;font-size:12.5px;color:var(--faint);margin-top:3px}
.track{height:6px;background:var(--surface-2);border-radius:99px;margin-top:9px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;transition:width .35s ease}

h3{font-size:13px;font-weight:600;color:var(--muted);margin:26px 0 6px}
.daylab{font-size:12.5px;color:var(--faint);margin:16px 0 2px}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.item .tag{width:7px;height:7px;border-radius:50%;flex:none}
.item .txt{flex:1;min-width:0}
.item .t1{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t2{font-size:12.5px;color:var(--faint)}
.item .num{font-weight:600;font-size:15px}
.item.open{background:var(--surface);border-radius:10px;padding:11px 12px;border-bottom-color:transparent}
.rm{display:flex;justify-content:flex-end;padding:0 2px 12px}
.rm button{font-size:13.5px;color:var(--over);padding:6px 10px;border:1px solid var(--line);border-radius:9px}

.empty{color:var(--faint);font-size:14px;padding:18px 0;line-height:1.6}
.err{color:var(--over);font-size:13.5px;min-height:18px;margin:6px 0 0}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.line{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0}
.line+.line{border-top:1px solid var(--line)}
.line .k{font-size:14px;color:var(--muted)}
.line .v{font-size:15px;font-weight:600}
.line .v.good{color:var(--comida)}
.line .v.bad{color:var(--over)}
.note{font-size:12.5px;color:var(--faint);line-height:1.6;margin:10px 0 0}

.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.monthnav strong{font-size:16px;font-weight:600}
.monthnav button{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:18px}
.bigrow{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.bigrow .n{font-size:38px;font-weight:700;letter-spacing:-.03em}

.wk{display:flex;align-items:center;gap:10px;padding:9px 0}
.wk .d{font-size:13px;color:var(--muted);width:78px;flex:none}
.wk .b{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.wk .b i{display:block;height:100%;background:var(--muted);border-radius:99px}
.wk.peor .b i{background:var(--over)}
.wk .n{font-size:13.5px;width:64px;text-align:right;flex:none}
.wk.peor .n{color:var(--over);font-weight:600}

.proj{width:100%;border-collapse:collapse;font-size:14px}
.proj th{font-size:12.5px;color:var(--faint);font-weight:500;text-align:right;padding:0 0 6px}
.proj th:first-child{text-align:left}
.proj td{padding:8px 0;border-top:1px solid var(--line);text-align:right}
.proj td:first-child{text-align:left;color:var(--muted)}
.proj tr.now td{color:var(--ink);font-weight:600}

.fab{position:fixed;left:0;right:0;bottom:0;padding:12px var(--pad);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 62%,transparent)}
.fab .in{max-width:520px;margin:0 auto}
.fab button{width:100%;background:var(--ink);color:#0E1216;font-weight:600;font-size:16px;padding:15px;border-radius:13px}

.scrim{position:fixed;inset:0;background:rgba(6,9,12,.66);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:10px var(--pad) calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(102%);transition:transform .26s cubic-bezier(.32,.72,0,1);max-width:520px;margin:0 auto}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
.amount{text-align:center;font-size:46px;font-weight:700;letter-spacing:-.03em;padding:2px 0 10px}
.amount.zero{color:var(--faint)}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chips button{flex:1;padding:11px 4px;border:1px solid var(--line);border-radius:11px;font-size:14px;font-weight:500;color:var(--muted)}
.chips button[data-b="ocio"].on{background:rgba(232,163,61,.16);border-color:var(--ocio);color:var(--ocio)}
.chips button[data-b="comida"].on{background:rgba(77,182,165,.16);border-color:var(--comida);color:var(--comida)}
.chips button[data-b="mensual"].on{background:rgba(140,123,224,.16);border-color:var(--mensual);color:var(--mensual)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.keys button{padding:15px 0;border-radius:12px;background:var(--surface-2);font-size:20px;font-weight:500}
.keys button:active{background:var(--line)}
.meta{display:flex;gap:8px;margin-bottom:12px}
.meta input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px;font-size:14.5px}
.meta input::placeholder{color:var(--faint)}
.meta input[type=date]{flex:none;width:150px;color:var(--muted)}
.save{width:100%;padding:15px;border-radius:13px;background:var(--ink);color:#0E1216;font-weight:600;font-size:16px}
.save[disabled]{background:var(--surface-2);color:var(--faint)}
.banner{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,10px);background:var(--ink);color:#0E1216;padding:9px 16px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;transition:.2s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>Control 300</h1>
    <span class="when" id="when"></span>
  </div>

  <div class="seg" id="seg">
    <button data-v="sem" class="on">Semana</button>
    <button data-v="mes">Mes</button>
    <button data-v="plan">Plan</button>
  </div>

  <div id="banner" class="banner hide"></div>

  <section id="v-sem">
    <div class="hero">
      <div class="lab">Te queda esta semana</div>
      <div class="amt" id="h-amt">—</div>
      <div class="sub" id="h-sub"></div>
    </div>
    <div id="bolsas"></div>
    <h3>Movimientos de la semana</h3>
    <div id="lista"></div>
    <p class="err" id="err"></p>
  </section>

  <section id="v-mes" class="hide">
    <div class="monthnav">
      <button id="prev" aria-label="Mes anterior">‹</button>
      <strong id="mesTit"></strong>
      <button id="next" aria-label="Mes siguiente">›</button>
    </div>
    <div class="bigrow"><span class="n" id="m-gas"></span><span class="when" id="m-de"></span></div>
    <div class="track" style="margin-bottom:18px"><i id="m-bar"></i></div>
    <div class="panel" id="m-bolsas"></div>
    <h3>Semana a semana</h3>
    <div id="m-semanas"></div>
    <p class="note" id="m-nota"></p>
  </section>

  <section id="v-plan" class="hide">
    <div class="panel" id="p-flujo"></div>
    <h3>Si todo va según el plan</h3>
    <table class="proj" id="p-proj"></table>
    <h3>Cada mes</h3>
    <div class="panel" id="p-rec"></div>
  </section>

</div>

<div class="fab"><div class="in"><button id="open">Apuntar gasto</button></div></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Apuntar gasto">
  <div class="grab"></div>
  <div class="amount zero" id="amt">0,00 €</div>
  <div class="chips" id="chips">
    <button data-b="ocio">Ocio</button>
    <button data-b="comida">Comida</button>
    <button data-b="mensual">Mensual</button>
  </div>
  <div class="keys" id="keys">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="c">C</button><button data-k="0">0</button><button data-k="del">⌫</button>
  </div>
  <div class="meta">
    <input id="nota" type="text" placeholder="Nota" maxlength="60">
    <input id="fecha" type="date">
  </div>
  <button class="save" id="save" disabled>Guardar gasto</button>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CFG = {
  url: "https://jqmfbodxyidnwnvqfjfh.supabase.co",
  anon: "sb_publishable_VzI9uNGpvzXuK3ZIodJCNw_H39Ri-ey",
  topes: { ocio: 30, comida: 20, mensual: 80 },
  gastoMes: 300,
  inicioPlan: "2026-09-01",
  finPlan: "2027-01-31",
  ingresos: 1460,
  fijos: [ {k:"Claude", v:23}, {k:"Barbería", v:15} ],
  aportacionETF: 1000,
  alColchon: 122,
  etfInicial: 2000,
  colchonInicial: 1253
};

const BOLSAS = {
  ocio:    { nom:"Ocio y salidas", col:"var(--ocio)" },
  comida:  { nom:"Comida fuera",   col:"var(--comida)" },
  mensual: { nom:"Bolsa mensual",  col:"var(--mensual)" }
};

const DEMO = !CFG.url || !CFG.anon;
const sb = DEMO ? null : supabase.createClient(CFG.url, CFG.anon);
const $ = s => document.querySelector(s);
const state = { gastos:[], bolsa:null, cents:0, mes:new Date(), abierto:null };

const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const lunes = d => { const x=new Date(d); x.setDate(x.getDate()-((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; };
const dias = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const eur = n => n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
const eur0 = n => Math.round(n).toLocaleString("es-ES") + " €";
const dm = d => `${d.getDate()}/${d.getMonth()+1}`;
const hoy = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };

function semillaDemo(){
  const l = lunes(hoy());
  const ayer = dias(hoy(),-1), antes = dias(hoy(),-3);
  return [
    { id:1, fecha:fmt(dias(l,-6)), importe:24.00, bolsa:"ocio",    nota:"Cena del sábado" },
    { id:2, fecha:fmt(dias(l,-4)), importe:7.80,  bolsa:"comida",  nota:"Menú" },
    { id:3, fecha:fmt(dias(l,-2)), importe:45.00, bolsa:"mensual", nota:"Espinilleras" },
    { id:4, fecha:fmt(antes),      importe:12.50, bolsa:"ocio",    nota:"Cañas tras el partido" },
    { id:5, fecha:fmt(ayer),       importe:4.20,  bolsa:"comida",  nota:"Café y bocadillo" },
    { id:6, fecha:fmt(hoy()),      importe:3.30,  bolsa:"comida",  nota:"Café" }
  ];
}
let seq = 100;

async function cargar(){
  $("#err").textContent = "";
  if(DEMO){ if(!state.gastos.length) state.gastos = semillaDemo(); return pinta(); }
  const { data, error } = await sb.from("gastos").select("*").order("fecha",{ascending:false}).order("created_at",{ascending:false});
  if(error){ $("#err").textContent = "No he podido cargar los datos. Comprueba la conexión y vuelve a entrar."; return; }
  state.gastos = data || [];
  pinta();
}

async function guardar(fila){
  if(DEMO){ state.gastos.push(Object.assign({id:++seq}, fila)); return true; }
  const { error } = await sb.from("gastos").insert(fila);
  if(error){ $("#err").textContent = "No se ha guardado. Inténtalo otra vez."; return false; }
  await cargar();
  return true;
}

async function borrar(id){
  if(DEMO){ state.gastos = state.gastos.filter(g => String(g.id)!==String(id)); return; }
  await sb.from("gastos").delete().eq("id", id);
  await cargar();
}

/* ── semana ─────────────────────────────── */
function pintaSemana(){
  const ini = lunes(hoy()), fin = dias(ini,6);
  $("#when").textContent = `${dm(ini)} – ${dm(fin)}`;
  const sem = state.gastos.filter(g => { const f=parse(g.fecha); return f>=ini && f<=fin; });
  const suma = b => sem.filter(g => g.bolsa===b).reduce((a,g)=>a+Number(g.importe),0);

  const topeSem = CFG.topes.ocio + CFG.topes.comida;
  const gastSem = suma("ocio") + suma("comida");
  const queda = topeSem - gastSem;
  const restan = 7 - ((hoy().getDay()+6)%7);
  $("#h-amt").classList.toggle("over", queda < 0);
  $("#h-amt").textContent = (queda < 0 ? "−" : "") + eur(Math.abs(queda));
  $("#h-sub").textContent = queda < 0
    ? `Te has pasado ${eur(-queda)} de los ${eur0(topeSem)} de la semana`
    : `De ${eur0(topeSem)} · ${restan === 1 ? "último día" : restan + " días por delante"}`;

  const i = parse(CFG.inicioPlan);
  const h = hoy();
  const meses = Math.max(1,(h.getFullYear()-i.getFullYear())*12 + (h.getMonth()-i.getMonth()) + 1);
  const topeMens = CFG.topes.mensual * meses;
  const gastMens = state.gastos.filter(g => g.bolsa==="mensual" && parse(g.fecha)>=i).reduce((a,g)=>a+Number(g.importe),0);

  const filas = [
    { b:"ocio",    gastado:suma("ocio"),   tope:CFG.topes.ocio,   pie:"esta semana" },
    { b:"comida",  gastado:suma("comida"), tope:CFG.topes.comida, pie:"esta semana" },
    { b:"mensual", gastado:gastMens,       tope:topeMens,         pie:`acumulado en ${meses} ${meses===1?"mes":"meses"}` }
  ];

  $("#bolsas").innerHTML = filas.map(f => {
    const q = f.tope - f.gastado;
    const pct = Math.max(0, Math.min(100, f.gastado / f.tope * 100));
    const col = q < 0 ? "var(--over)" : BOLSAS[f.b].col;
    return `<div class="bolsa">
      <div class="r1">
        <span class="nm"><i style="background:${BOLSAS[f.b].col}"></i>${BOLSAS[f.b].nom}</span>
        <span class="val" style="color:${col}">${q<0?"−":""}${eur(Math.abs(q))}</span>
      </div>
      <div class="track"><i style="width:${pct}%;background:${col}"></i></div>
      <div class="r2"><span>${eur(f.gastado)} de ${eur0(f.tope)}</span><span>${f.pie}</span></div>
    </div>`;
  }).join("");

  if(!sem.length){
    $("#lista").innerHTML = `<p class="empty">Semana limpia de momento. El primer gasto que hagas, apúntalo aquí mismo.</p>`;
    return;
  }
  const porDia = {};
  sem.forEach(g => { (porDia[g.fecha] = porDia[g.fecha] || []).push(g); });
  const etiqueta = f => {
    const d = parse(f), t = hoy();
    if(f === fmt(t)) return "Hoy";
    if(f === fmt(dias(t,-1))) return "Ayer";
    return d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric"});
  };
  $("#lista").innerHTML = Object.keys(porDia).sort().reverse().map(f => {
    const total = porDia[f].reduce((a,g)=>a+Number(g.importe),0);
    return `<div class="daylab">${etiqueta(f)} · ${eur(total)}</div>` + porDia[f].map(g => {
      const open = String(state.abierto) === String(g.id);
      return `<button class="item${open?" open":""}" data-id="${g.id}">
          <span class="tag" style="background:${BOLSAS[g.bolsa].col}"></span>
          <span class="txt"><span class="t1">${g.nota ? esc(g.nota) : BOLSAS[g.bolsa].nom}</span>
          <span class="t2">${BOLSAS[g.bolsa].nom}</span></span>
          <span class="num">${eur(Number(g.importe))}</span>
        </button>` + (open ? `<div class="rm"><button data-del="${g.id}">Borrar gasto</button></div>` : "");
    }).join("");
  }).join("");
}
const esc = s => s.replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));

/* ── mes ────────────────────────────────── */
function pintaMes(){
  const y = state.mes.getFullYear(), m = state.mes.getMonth();
  const ini = new Date(y,m,1), fin = new Date(y,m+1,0);
  $("#mesTit").textContent = ini.toLocaleDateString("es-ES",{month:"long",year:"numeric"});

  const mes = state.gastos.filter(g => { const f=parse(g.fecha); return f>=ini && f<=fin; });
  const total = mes.reduce((a,g)=>a+Number(g.importe),0);
  const sobra = CFG.gastoMes - total;
  $("#m-gas").textContent = eur(total);
  $("#m-de").textContent = `de ${eur0(CFG.gastoMes)}`;
  $("#m-bar").style.width = Math.min(100, total/CFG.gastoMes*100) + "%";
  $("#m-bar").style.background = total <= CFG.gastoMes ? "var(--comida)" : "var(--over)";

  $("#m-bolsas").innerHTML = Object.keys(BOLSAS).map(b => {
    const s = mes.filter(g=>g.bolsa===b).reduce((a,g)=>a+Number(g.importe),0);
    return `<div class="line"><span class="k"><span style="color:${BOLSAS[b].col}">●</span> ${BOLSAS[b].nom}</span><span class="v">${eur(s)}</span></div>`;
  }).join("") + `<div class="line"><span class="k">${sobra>=0?"Sobrante al colchón":"Te has pasado"}</span><span class="v ${sobra>=0?"good":"bad"}">${eur(Math.abs(sobra))}</span></div>`;

  const sems = [];
  for(let d = lunes(ini); d <= fin; d = dias(d,7)){
    const f = dias(d,6);
    const t = mes.filter(x => { const p=parse(x.fecha); return p>=d && p<=f && x.bolsa!=="mensual"; })
                 .reduce((a,x)=>a+Number(x.importe),0);
    sems.push({ ini:new Date(d), fin:f, total:t });
  }
  const peor = Math.max(...sems.map(s=>s.total), 0);
  const tope = Math.max(peor, CFG.topes.ocio + CFG.topes.comida);
  $("#m-semanas").innerHTML = sems.map(s => `
    <div class="wk${s.total===peor && peor>0 ? " peor":""}">
      <span class="d">${dm(s.ini)} – ${dm(s.fin)}</span>
      <span class="b"><i style="width:${Math.min(100,s.total/tope*100)}%"></i></span>
      <span class="n">${eur(s.total)}</span>
    </div>`).join("");
  $("#m-nota").textContent = "La barra compara las semanas entre sí. Solo cuentan ocio y comida fuera, porque la bolsa mensual no tiene tope semanal.";
}

/* ── plan ───────────────────────────────── */
function pintaPlan(){
  const fijos = CFG.fijos.reduce((a,f)=>a+f.v,0);
  const filas = [
    ["Entra cada mes", CFG.ingresos, ""],
    ...CFG.fijos.map(f => [f.k, -f.v, ""]),
    ["Al ETF, día 2", -CFG.aportacionETF, ""],
    ["Al colchón", -CFG.alColchon, "good"],
    ["Para gastar", CFG.ingresos - fijos - CFG.aportacionETF - CFG.alColchon, ""]
  ];
  $("#p-flujo").innerHTML = filas.map(([k,v,c]) =>
    `<div class="line"><span class="k">${k}</span><span class="v ${c}">${v<0?"−":""}${eur0(Math.abs(v))}</span></div>`).join("");

  const ini = parse(CFG.inicioPlan), fin = parse(CFG.finPlan);
  let etf = CFG.etfInicial, col = CFG.colchonInicial, filas2 = [];
  const mesActual = new Date().getMonth() + "-" + new Date().getFullYear();
  for(let d = new Date(ini); d <= fin; d.setMonth(d.getMonth()+1)){
    etf += CFG.aportacionETF; col += CFG.alColchon;
    filas2.push({
      nom: d.toLocaleDateString("es-ES",{month:"long"}),
      etf, col,
      now: (d.getMonth()+"-"+d.getFullYear()) === mesActual
    });
  }
  $("#p-proj").innerHTML =
    `<tr><th>Al cerrar</th><th>Puesto en el ETF</th><th>Colchón</th></tr>` +
    filas2.map(f => `<tr class="${f.now?"now":""}"><td>${f.nom}</td><td>${eur0(f.etf)}</td><td>${eur0(f.col)}</td></tr>`).join("");

  $("#p-rec").innerHTML = [
    ["Día 1", `Transferir ${eur0(CFG.aportacionETF + CFG.alColchon)} a Trade Republic`],
    ["Día 2", "Comprobar que el plan se ha ejecutado"],
    ["Domingo", "Mirar la semana y cerrar cuentas"]
  ].map(([k,v]) => `<div class="line"><span class="k">${k}</span><span class="v" style="font-weight:500;font-size:14px">${v}</span></div>`).join("");
}

function pinta(){ pintaSemana(); pintaMes(); pintaPlan(); }

/* ── hoja de apuntar ────────────────────── */
function pintaImporte(){
  const n = state.cents/100;
  $("#amt").textContent = eur(n);
  $("#amt").classList.toggle("zero", state.cents===0);
  $("#save").disabled = !(state.cents>0 && state.bolsa);
}
function abrir(){
  state.cents=0; state.bolsa=null;
  $("#nota").value=""; $("#fecha").value = fmt(hoy());
  [...$("#chips").children].forEach(c=>c.classList.remove("on"));
  pintaImporte();
  $("#sheet").classList.add("on"); $("#scrim").classList.add("on");
}
function cerrar(){ $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); }

$("#open").onclick = abrir;
$("#scrim").onclick = cerrar;
$("#keys").onclick = e => {
  const k = e.target.dataset.k; if(!k) return;
  if(k==="c") state.cents = 0;
  else if(k==="del") state.cents = Math.floor(state.cents/10);
  else if(state.cents < 1000000) state.cents = state.cents*10 + Number(k);
  pintaImporte();
};
$("#chips").onclick = e => {
  const b = e.target.dataset.b; if(!b) return;
  state.bolsa = b;
  [...$("#chips").children].forEach(c => c.classList.toggle("on", c.dataset.b===b));
  pintaImporte();
};
$("#save").onclick = async () => {
  const fila = {
    importe: state.cents/100,
    bolsa: state.bolsa,
    fecha: $("#fecha").value || fmt(hoy()),
    nota: $("#nota").value.trim() || null
  };
  $("#save").disabled = true;
  const ok = await guardar(fila);
  cerrar();
  if(ok){ pinta(); toast("Gasto apuntado"); }
};

$("#lista").onclick = async e => {
  const del = e.target.closest("[data-del]");
  if(del){ await borrar(del.dataset.del); state.abierto=null; pinta(); toast("Gasto borrado"); return; }
  const it = e.target.closest(".item");
  if(!it) return;
  state.abierto = String(state.abierto)===it.dataset.id ? null : it.dataset.id;
  pintaSemana();
};

$("#seg").onclick = e => {
  const v = e.target.dataset.v; if(!v) return;
  [...$("#seg").children].forEach(b => b.classList.toggle("on", b.dataset.v===v));
  ["sem","mes","plan"].forEach(x => $("#v-"+x).classList.toggle("hide", x!==v));
};
$("#prev").onclick = () => { state.mes = new Date(state.mes.getFullYear(), state.mes.getMonth()-1, 1); pintaMes(); };
$("#next").onclick = () => { state.mes = new Date(state.mes.getFullYear(), state.mes.getMonth()+1, 1); pintaMes(); };

let tt;
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),1500); }

if(DEMO){
  $("#banner").classList.remove("hide");
  $("#banner").textContent = "Modo demo con datos de ejemplo. Pon tu Project URL y tu clave anon en CFG para conectarlo a Supabase.";
}
cargar();
</script>
