<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control 300</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#252a34;--tx:#e8eaed;--dim:#9aa3af;--ok:#3ecf8e;--warn:#f5b731;--bad:#ef5f5f;--acc:#6ea8fe}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:20px;margin:0}
h3{font-size:15px;color:var(--dim);margin:20px 0 8px;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.big{font-size:20px;font-weight:700}
.dim{color:var(--dim);font-size:13px}
.bar{height:7px;background:#20242d;border-radius:99px;margin-top:9px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .2s}
input,select,button{font:inherit;color:var(--tx)}
input{width:100%;background:#0d1016;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:8px}
button{background:#222735;border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer}
.pick{display:flex;gap:8px;margin-bottom:8px}
.pick button{flex:1}
.pick button.on{background:var(--acc);border-color:var(--acc);color:#0b0d12;font-weight:700}
.go{width:100%;background:var(--ok);border-color:var(--ok);color:#08120d;font-weight:700;margin-top:4px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1}
.tabs button.on{background:#2b3140;border-color:var(--acc)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
li small{color:var(--dim);display:block}
.del{background:none;border:none;color:var(--dim);padding:4px 8px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
tr.peor td{color:var(--bad);font-weight:600}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.err{color:var(--bad);font-size:14px;min-height:20px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">

  <div id="login">
    <h1>Control 300</h1>
    <p class="dim">Entra para ver tus gastos.</p>
    <input id="email" type="email" placeholder="email" autocomplete="username">
    <input id="pass" type="password" placeholder="contraseña" autocomplete="current-password">
    <button class="go" id="btnLogin">Entrar</button>
    <p class="err" id="errLogin"></p>
  </div>

  <div id="app" class="hide">
    <div class="top">
      <h1>Control 300</h1>
      <button id="btnOut">Salir</button>
    </div>

    <div class="tabs">
      <button id="tSem" class="on">Semana</button>
      <button id="tMes">Mes</button>
    </div>

    <section id="vSem">
      <div id="bolsas"></div>

      <h3>Apuntar gasto</h3>
      <input id="imp" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Importe €">
      <div class="pick" id="pick">
        <button data-b="ocio">Ocio</button>
        <button data-b="comida">Comida</button>
        <button data-b="mensual">Mensual</button>
      </div>
      <input id="nota" type="text" placeholder="Nota (opcional)">
      <input id="fecha" type="date">
      <button class="go" id="btnAdd">Añadir</button>
      <p class="err" id="errAdd"></p>

      <h3>Esta semana</h3>
      <ul id="lista"></ul>
    </section>

    <section id="vMes" class="hide">
      <div class="nav">
        <button id="prev">‹</button>
        <strong id="mesTit"></strong>
        <button id="next">›</button>
      </div>
      <div class="card">
        <div class="row"><span class="dim">Presupuesto</span><span id="mPres"></span></div>
        <div class="row"><span class="dim">Gastado</span><span class="big" id="mGas"></span></div>
        <div class="row"><span class="dim">Sobrante al colchón</span><span id="mSob"></span></div>
      </div>
      <h3>Por bolsa</h3>
      <table id="tBolsa"></table>
      <h3>Por semana</h3>
      <table id="tSemana"></table>
      <p class="dim" id="notaMes"></p>
    </section>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CFG = {
  url: "https://TU-PROYECTO.supabase.co",
  anon: "TU-CLAVE-ANON",
  topes: { ocio: 30, comida: 20, mensual: 80 },
  presupuestoMes: 300,
  inicioPlan: "2026-09-01"
};
const NOMBRE = { ocio:"Ocio y salidas", comida:"Comida fuera", mensual:"Bolsa mensual" };

const sb = supabase.createClient(CFG.url, CFG.anon);
const $ = s => document.querySelector(s);
const state = { gastos: [], bolsa: null, mes: new Date() };

const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const lunes = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay()+6)%7)); x.setHours(0,0,0,0); return x; };
const addDias = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const eur = n => n.toFixed(2).replace(".", ",") + " €";
const dm = d => `${d.getDate()}/${d.getMonth()+1}`;

sb.auth.getSession().then(({data}) => arranca(data.session));
sb.auth.onAuthStateChange((_, s) => arranca(s));

async function arranca(session){
  if(!session){ $("#login").classList.remove("hide"); $("#app").classList.add("hide"); return; }
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  $("#fecha").value = fmt(new Date());
  await cargar();
}

$("#btnLogin").onclick = async () => {
  $("#errLogin").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#pass").value });
  if(error) $("#errLogin").textContent = "No he podido entrar. Revisa email y contraseña.";
};
$("#btnOut").onclick = () => sb.auth.signOut();

async function cargar(){
  const { data, error } = await sb.from("gastos").select("*").order("fecha",{ascending:false}).order("created_at",{ascending:false});
  if(error){ $("#errAdd").textContent = "Error al cargar los datos."; return; }
  state.gastos = data || [];
  pinta();
}

$("#pick").onclick = e => {
  const b = e.target.dataset.b; if(!b) return;
  state.bolsa = b;
  [...$("#pick").children].forEach(x => x.classList.toggle("on", x.dataset.b === b));
};

$("#btnAdd").onclick = async () => {
  $("#errAdd").textContent = "";
  const importe = parseFloat(($("#imp").value || "").replace(",", "."));
  if(!(importe > 0)) return $("#errAdd").textContent = "Pon un importe.";
  if(!state.bolsa) return $("#errAdd").textContent = "Elige la bolsa.";
  const fila = { importe, bolsa: state.bolsa, fecha: $("#fecha").value || fmt(new Date()), nota: $("#nota").value.trim() || null };
  const { error } = await sb.from("gastos").insert(fila);
  if(error) return $("#errAdd").textContent = "No se ha guardado. Inténtalo otra vez.";
  $("#imp").value = ""; $("#nota").value = ""; $("#fecha").value = fmt(new Date());
  state.bolsa = null; [...$("#pick").children].forEach(x => x.classList.remove("on"));
  await cargar();
};

async function borrar(id){
  if(!confirm("¿Borrar este gasto?")) return;
  await sb.from("gastos").delete().eq("id", id);
  await cargar();
}

function pinta(){ pintaSemana(); pintaMes(); }

function pintaSemana(){
  const ini = lunes(new Date()), fin = addDias(ini,6);
  const semana = state.gastos.filter(g => { const f = parse(g.fecha); return f >= ini && f <= fin; });
  const suma = b => semana.filter(g => g.bolsa === b).reduce((a,g) => a + Number(g.importe), 0);

  const mesesPlan = (() => {
    const i = parse(CFG.inicioPlan), h = new Date();
    return Math.max(1, (h.getFullYear()-i.getFullYear())*12 + (h.getMonth()-i.getMonth()) + 1);
  })();
  const topeMensual = CFG.topes.mensual * mesesPlan;
  const gastadoMensual = state.gastos.filter(g => g.bolsa === "mensual" && parse(g.fecha) >= parse(CFG.inicioPlan))
                                     .reduce((a,g) => a + Number(g.importe), 0);

  const filas = [
    { b:"ocio", gastado: suma("ocio"), tope: CFG.topes.ocio, pie: `Semana del ${dm(ini)} al ${dm(fin)}` },
    { b:"comida", gastado: suma("comida"), tope: CFG.topes.comida, pie: `Semana del ${dm(ini)} al ${dm(fin)}` },
    { b:"mensual", gastado: gastadoMensual, tope: topeMensual, pie: `Acumulado desde el inicio del plan` }
  ];

  $("#bolsas").innerHTML = filas.map(f => {
    const queda = f.tope - f.gastado, pct = Math.min(100, f.gastado / f.tope * 100);
    const col = pct < 70 ? "var(--ok)" : pct < 100 ? "var(--warn)" : "var(--bad)";
    return `<div class="card">
      <div class="row"><strong>${NOMBRE[f.b]}</strong><span class="big" style="color:${col}">${eur(queda)}</span></div>
      <div class="row"><span class="dim">${f.pie}</span><span class="dim">${eur(f.gastado)} de ${eur(f.tope)}</span></div>
      <div class="bar"><i style="width:${pct}%;background:${col}"></i></div>
    </div>`;
  }).join("");

  $("#lista").innerHTML = semana.length ? semana.map(g => `<li>
      <span>${eur(Number(g.importe))} <small>${NOMBRE[g.bolsa]}${g.nota ? " · " + g.nota : ""} · ${dm(parse(g.fecha))}</small></span>
      <button class="del" data-id="${g.id}">✕</button>
    </li>`).join("") : `<li><span class="dim">Nada apuntado esta semana.</span></li>`;
  $("#lista").querySelectorAll(".del").forEach(b => b.onclick = () => borrar(b.dataset.id));
}

function pintaMes(){
  const y = state.mes.getFullYear(), m = state.mes.getMonth();
  const ini = new Date(y,m,1), fin = new Date(y,m+1,0);
  $("#mesTit").textContent = ini.toLocaleDateString("es-ES",{month:"long",year:"numeric"});

  const mes = state.gastos.filter(g => { const f = parse(g.fecha); return f >= ini && f <= fin; });
  const total = mes.reduce((a,g) => a + Number(g.importe), 0);
  $("#mPres").textContent = eur(CFG.presupuestoMes);
  $("#mGas").textContent = eur(total);
  $("#mSob").textContent = eur(CFG.presupuestoMes - total);
  $("#mSob").style.color = total <= CFG.presupuestoMes ? "var(--ok)" : "var(--bad)";

  $("#tBolsa").innerHTML = ["ocio","comida","mensual"].map(b => {
    const s = mes.filter(g => g.bolsa === b).reduce((a,g) => a + Number(g.importe), 0);
    return `<tr><td>${NOMBRE[b]}</td><td>${eur(s)}</td></tr>`;
  }).join("");

  const semanas = [];
  for(let d = lunes(ini); d <= fin; d = addDias(d,7)){
    const f = addDias(d,6);
    const g = mes.filter(x => { const p = parse(x.fecha); return p >= d && p <= f && x.bolsa !== "mensual"; })
                 .reduce((a,x) => a + Number(x.importe), 0);
    semanas.push({ ini:new Date(d), fin:f, total:g });
  }
  const peor = Math.max(...semanas.map(s => s.total), 0);
  $("#tSemana").innerHTML = semanas.map(s =>
    `<tr class="${s.total === peor && peor > 0 ? "peor" : ""}"><td>${dm(s.ini)} – ${dm(s.fin)}</td><td>${eur(s.total)}</td></tr>`
  ).join("");
  $("#notaMes").textContent = "Por semana se cuentan ocio y comida fuera. La bolsa mensual va aparte porque no tiene tope semanal.";
}

$("#tSem").onclick = () => { $("#vSem").classList.remove("hide"); $("#vMes").classList.add("hide"); $("#tSem").classList.add("on"); $("#tMes").classList.remove("on"); };
$("#tMes").onclick = () => { $("#vMes").classList.remove("hide"); $("#vSem").classList.add("hide"); $("#tMes").classList.add("on"); $("#tSem").classList.remove("on"); };
$("#prev").onclick = () => { state.mes = new Date(state.mes.getFullYear(), state.mes.getMonth()-1, 1); pintaMes(); };
$("#next").onclick = () => { state.mes = new Date(state.mes.getFullYear(), state.mes.getMonth()+1, 1); pintaMes(); };
</script>
</body>
</html>
