<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracker">
<title>My Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1216; --surface:#161C22; --surface-2:#1E262E; --line:#28323C;
  --ink:#ECEFF3; --muted:#8A97A5; --faint:#5C6773;
  --ok:#4DB6A5; --bad:#E2574C; --warn:#E8A33D;
  --k-trabajo:#7C93A8; --k-clase:#7C93A8; --k-comida:#4DB6A5; --k-gym:#E8A33D;
  --k-futbol:#E8A33D; --k-estudio:#8C7BE0; --k-rutina:#5C6773; --k-clave:#ECEFF3;
  --pad:16px;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:400 15px/1.45 "Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding:16px var(--pad) 60px}
button,input{font:inherit;color:inherit;font-variant-numeric:tabular-nums}
button{background:none;border:none;padding:0;cursor:pointer}
.hide{display:none!important}

.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.head h1{font-size:17px;font-weight:600;margin:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.ok{background:var(--ok)}.dot.syncing{background:var(--warn);animation:p 1s infinite}.dot.err{background:var(--bad)}
@keyframes p{50%{opacity:.3}}

.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.daynav button.arr{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;color:var(--muted);font-size:19px;flex:none}
.daynav .lbl{flex:1;text-align:center}
.daynav .lbl b{display:block;font-size:16px;font-weight:600}
.daynav .lbl span{font-size:12.5px;color:var(--faint)}

.seg{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.seg .t{font-size:13px;color:var(--muted);flex:none}
.seg .opts{flex:1;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg .opts button{flex:1;padding:7px 4px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg .opts button.on{background:var(--surface-2);color:var(--ink);font-weight:600}

.banner{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.banner b{color:var(--ink);font-weight:600}
.also{border-left:3px solid var(--warn)}

h3{font-size:13px;font-weight:600;color:var(--muted);margin:20px 0 6px;text-transform:uppercase;letter-spacing:.06em}

/* Agenda */
.it{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.it .tm{width:44px;flex:none;font-size:13.5px;color:var(--muted);padding-top:1px}
.it .bar{width:3px;align-self:stretch;border-radius:2px;flex:none;background:var(--k-rutina)}
.it .tx{flex:1;font-size:14.5px;line-height:1.4}
.it .tx small{display:block;font-size:12.5px;color:var(--faint);margin-top:1px}
.it.key .tx{font-weight:600}
.it.key .tm{color:var(--ink);font-weight:600}
.it.past{opacity:.38}
.it.now{background:var(--surface);border-radius:10px;padding:9px 10px;margin:0 -10px;border-bottom-color:transparent}
.it .tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--bg);background:var(--ink);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.it .tag.next{background:var(--surface-2);color:var(--muted)}

/* Registro */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.card .ct{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.card .ct b{font-size:15.5px;font-weight:600}
.card .ct span{font-size:12.5px;color:var(--faint)}
.chainnote{font-size:12.5px;color:var(--faint);margin-bottom:12px}
.row{padding:12px 0;border-top:1px solid var(--line)}
.row .q{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.row .q span{font-size:14px;color:var(--muted)}
.row .q em{font-style:normal;font-size:12.5px;font-weight:600}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}.neu-t{color:var(--faint)}
.hm{display:flex;gap:8px;align-items:center}
.hm input{width:72px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 8px;font-size:20px;font-weight:600;text-align:center;outline:none;-webkit-appearance:none}
.hm input:focus{border-color:var(--muted)}
.hm .u{font-size:13px;color:var(--faint);margin-right:6px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:52px;height:44px;border:1px solid var(--line);border-radius:11px;font-size:22px;color:var(--muted);background:var(--bg)}
.step button:active{background:var(--surface-2)}
.step .v{flex:1;text-align:center;font-size:26px;font-weight:700;letter-spacing:-.02em}
.save{width:100%;margin-top:12px;padding:14px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15.5px}
.save:disabled{background:var(--surface-2);color:var(--faint)}
.done{display:flex;gap:8px;margin-top:4px}
.done .c{flex:1;background:var(--bg);border-radius:11px;padding:10px 6px;text-align:center}
.done .c .l{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.done .c .n{font-size:18px;font-weight:700;margin-top:2px}
.link{font-size:13px;color:var(--muted);text-decoration:underline;margin-top:10px;display:inline-block}

/* Semana */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 2px;text-align:center;cursor:pointer}
.wd.sel{border-color:var(--muted)}
.wd .l{font-size:11px;color:var(--faint)}
.wd .n{font-size:14px;font-weight:600;margin:1px 0 5px}
.wd .ds{display:flex;flex-direction:column;align-items:center;gap:3px}
.wd .ds i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.wd .ds i.ok{background:var(--ok)}.wd .ds i.neu{background:var(--muted)}.wd .ds i.bad{background:var(--bad)}.wd .ds i.na{background:transparent;border:1px solid var(--line);width:6px;height:6px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--faint);margin-top:8px;flex-wrap:wrap}
.rule{font-size:13.5px;color:var(--muted);margin-top:12px;line-height:1.5}
.rule b{color:var(--ink)}
.prog{display:flex;gap:5px;margin-top:8px}
.prog i{flex:1;height:6px;border-radius:99px;background:var(--surface-2);display:block}
.prog i.on{background:var(--ok)}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;transition:.2s;pointer-events:none;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<body>
<div class="wrap">
  <div class="head"><h1>My Tracker</h1><span class="dot" id="sync"></span></div>

  <div class="daynav">
    <button class="arr" id="prev" aria-label="Previous day">‹</button>
    <div class="lbl"><b id="dlbl"></b><span id="drel"></span></div>
    <button class="arr" id="next" aria-label="Next day">›</button>
  </div>

  <div class="seg">
    <span class="t">Match this weekend</span>
    <div class="opts" id="match">
      <button data-m="sab">Saturday</button>
      <button data-m="dom">Sunday</button>
    </div>
  </div>

  <div id="banners"></div>
  <div id="regTop"></div>
  <h3>The day</h3>
  <div id="agenda"></div>
  <div id="regBottom"></div>

  <h3>Last 7 days</h3>
  <div class="wk" id="week"></div>
  <div class="legend"><span>Top: phone</span><span>Middle: lights off</span><span>Bottom: leaving home</span></div>
  <div class="rule" id="rule"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ═══ SETTINGS ═══════════════════════════════════════════════
const SB_URL = 'https://jqmfbodxyidnwnvqfjfh.supabase.co';
const SB_KEY = 'sb_publishable_VzI9uNGpvzXuK3ZIodJCNw_H39Ri-ey';

const OBJ = { movil: 90, luz: '23:15', salida: '07:40' }; // screen minutes, lights-off time, time to leave home
const FESTIVOS = ['2026-10-12', '2026-12-08', '2026-12-25'];
const TRANSFER = '€1,122 to Trade Republic: €1,000 to the ETF and €122 to the emergency fund';
const SHAKE = '400 ml milk, 50 g oat flour, 30 g whey and the creatine';

// ═══ DATES ══════════════════════════════════════════════════
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const ds = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const add = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
const dow = s => pd(s).getDay();
const lunes = s => add(s, -((dow(s)+6)%7));
const diff = (a,b) => Math.round((pd(b)-pd(a))/86400000);
// The day ends at 04:00: if you log at 00:30, it still counts as the day before.
const DAY_END = 4;
const logicalToday = () => ds(new Date(Date.now() - DAY_END*3600*1000));
const q = new URLSearchParams(location.search).get('hoy');       // ?hoy=2026-10-06 to test
const HOY = q && /^\d{4}-\d{2}-\d{2}$/.test(q) ? q : logicalToday();
const esFestivo = s => FESTIVOS.includes(s);
const laborable = s => dow(s)>=1 && dow(s)<=5 && !esFestivo(s);
const primerMartes = s => dow(s)===2 && pd(s).getDate()<=7;
const fmtDate = s => { const d = pd(s); return DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]; };

// Times as minutes. For lights off, after midnight counts as late (00:30 → 24:30).
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const fmt = m => { m = ((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); };
const luzMin = t => { const m = toMin(t); return m < 720 ? m+1440 : m; };
const fmtMov = m => m==null ? '–' : Math.floor(m/60) ? Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m' : m+' min';
const nowMin = () => { const n = new Date(); let m = n.getHours()*60+n.getMinutes(); if(n.getHours() < DAY_END) m += 1440; return m; };

// ═══ WEEKLY PLAN ════════════════════════════════════════════
// k: trabajo · clase · comida · gym · futbol · estudio · rutina · clave
// The "clave" items are the chain: leave home, daily log and lights off.
function plan(s, partido){
  const d = dow(s), B = partido==='dom', fest = esFestivo(s), it = [];
  const P = (t,txt,k,sub,extra) => it.push(Object.assign({t,txt,k,sub},extra||{}));
  const gymFinde = (d===0 && !B) || (d===6 && B);
  const domTotal = (d===2 || gymFinde) ? 3 : 5;

  // Weekday bank holiday: a free day, keeping the day's sport and the evening
  if(fest && d>=1 && d<=5){
    P('09:00','Get up, at the latest','rutina','Easy breakfast and 2 sets of pull-ups');
    P('10:00','Study: English','estudio','Until 12:00');
    P('12:00','Shake + banana','comida');
    if(d===2) P('12:30','Gym: pull','gym','With Romanian deadlifts. Legs are the fitness coach’s job');
    if(d===5) P('12:30','Gym: push','gym');
    P('14:00','Lunch','comida');
    P('16:00','Study: uni work or GEPR','estudio','Until 17:30');
    P('18:00','Sandwich','comida');
    if(d===2) P('19:00','Training with the fitness coach','futbol','If there’s training');
    if(d===3 || d===4) P('19:45','Football','futbol','If there’s training');
    if(d===5 && !B) P('19:30','English class','clase','If there’s a class');
    P('21:30','Dinner','comida');
  }

  // Monday to Friday morning
  if(d>=1 && d<=5 && !fest){
    let sub = 'Water, 2 sets of pull-ups and no phone until you leave';
    if(d===2) sub = 'Weigh-in on an empty stomach'+(primerMartes(s)?', waist and photo':'')+' · '+sub.charAt(0).toLowerCase()+sub.slice(1);
    P('06:55','Get up','rutina',sub);
    P('07:00','Breakfast','comida');
    P('07:35','Into the bag: shake from the fridge, sandwich from the freezer','rutina');
    P('07:40','Leave home','clave','Leave at this time and you’re on time',{cadena:'salida'});
    P('08:15','Work until 14:15','trabajo','Shake into the office fridge');
    P('11:00', d===5 && !B ? 'Shake + yoghurt or a second banana' : 'Shake + banana','comida', d===5 && !B ? 'Lunch is light today, so the mid-morning snack is bigger' : null);
  }

  // Each day's own plan
  if(fest && d>=1 && d<=5){ /* already above */ }
  else if(d===1){
    P('13:45','Lunch at work','comida','Lunchbox; your working day runs half an hour longer');
    P('15:00','Class until 21:00','clase');
    P('18:00','Sandwich in the break','comida');
    P('21:30','Dinner','comida','Grilled meat + a side from the fridge');
  }
  else if(d===2){
    P('14:30','Lunch at the gym','comida');
    P('15:00','Gym: pull','gym','With Romanian deadlifts. Legs are the fitness coach’s job');
    P('16:15','Sandwich after the gym','comida');
    P('16:30','Study: power electronics','estudio','Until 18:30');
    P('18:30','Banana, then off to training','comida');
    P('19:00','Fitness coach until 20:00','futbol','Leg strength and aerobic work');
    P('20:15','Shower when you get home','rutina');
    P('20:30','Dinner and Tuesday batch at the same time','comida','40 min · pasta, mince and potatoes for Thursday and Friday');
  }
  else if(d===3){
    P('13:45','Lunch at work','comida');
    P('15:00','Class until 19:00','clase');
    P('18:00','Sandwich','comida');
    P('19:45','Football','futbol');
    P('21:45','Dinner','comida');
  }
  else if(d===4){
    P('13:45','Light lunch at work','comida','No proper meal yet: futsal at 15:00');
    P('15:00','Futsal','futbol');
    P('16:30','Proper lunch','comida','The second lunchbox');
    if(!B){
      P('17:15','Study: uni work or GEPR','estudio','Until 19:00');
      P('18:30','Sandwich','comida');
      P('19:45','Football','futbol');
      P('21:45','Dinner','comida');
    } else {
      P('18:00','Gym: push','gym','This week football training moves to Friday');
      P('19:30','Sandwich after the gym','comida');
      P('21:00','Dinner','comida');
    }
  }
  else if(d===5){
    if(!B){
      P('14:30','Light lunch','comida','Gym in 45 minutes');
      P('15:15','Gym: push','gym');
      P('16:40','Sandwich on the way','comida');
      P('17:00','Class until 19:00','clase');
      P('19:30','English class until 20:30','clase','With your teacher');
      P('20:45','Big dinner','comida','Today’s main meal');
      P('21:30','Free evening','rutina');
    } else {
      P('14:30','Lunch','comida');
      P('15:15','Study: uni work or GEPR','estudio','Until 16:45, in the gym slot');
      P('17:00','Class until 19:00','clase');
      P('19:00','Sandwich after class','comida');
      P('19:45','Football','futbol');
      P('21:45','Dinner','comida');
    }
  }
  if(d===6){
    if(!B){
      P('09:00','Get up, at the latest','rutina','Pancakes for breakfast');
      P('10:00','Study: English','estudio','Until 12:30. Start with yesterday’s homework');
      P('12:30','Weekly shop','rutina');
      P('13:30','Lunch','comida','Almost three hours before the squad meet-up');
      P('15:30','Light snack','comida');
      P('16:15','Squad meet-up','futbol','Kick-off at 18:45');
      P('21:00','Dinner when you get back','comida');
    } else {
      P('09:00','Get up, at the latest','rutina','Pancakes for breakfast');
      P('10:00','English class until 11:00','clase','With your teacher');
      P('11:30','Gym: mixed','gym');
      P('13:00','Weekly shop and bread','rutina');
      P('14:00','Lunch','comida');
      P('16:30','Study: English','estudio','Until 18:00. Start with the class homework');
      P('18:00','Big batch cook','comida','Lunchboxes, and five sandwiches into the freezer · 90 min');
      P('19:45','Dinner','comida');
      P('20:30','Finances: close the week','rutina','10 min');
    }
  }
  if(d===0){
    if(!B){
      P('09:00','Get up, at the latest','rutina','Buy the bread for the sandwiches');
      P('11:00','Gym: mixed','gym');
      P('14:00','Lunch','comida');
      P('16:00','Study: English','estudio','Until 17:45. Sunday afternoon is spoken for');
      P('17:45','Finances: close the week','rutina','10 min');
      P('18:00','Big batch cook','comida','Lunchboxes, and five sandwiches into the freezer · 90 min');
      P('19:45','Dinner','comida');
      P('20:30','Extended evening routine','rutina','Shake, Monday’s lunchbox and clothes: tomorrow is the long day');
    } else {
      P('09:00','Get up, at the latest','rutina');
      P('09:30','First thing: get Monday ready','rutina','Shake, lunchbox and clothes. You’ll be back exhausted');
      P('10:00','Study: uni work or GEPR','estudio','Until 12:00');
      P('12:30','Lunch','comida','About three hours before the match');
      P('13:30','Bus there: English by ear','estudio','Podcast, series or audiobook. No Instagram');
      P('16:30','Match','futbol','Kick-off depends on the ground');
      P('18:30','Bus back: English by ear','estudio');
      P('21:00','Dinner when you get home','comida');
    }
  }

  // Evening
  const mañanaTrabajo = laborable(add(s,1));
  if(mañanaTrabajo){
    if(d!==2) P('22:20','Shower','rutina');   // on Tuesday, after the fitness coach
    const ritualHecho = d===0; // Sunday: extended routine at 20:30 (A) or in the morning (B)
    if(!ritualHecho){
      P('22:35','Evening routine','rutina', 'Tomorrow’s shake ('+SHAKE+'), banana, '+(d===3?'both lunchboxes for Thursday':'lunchbox if needed')+', clothes, and the phone charging outside the bedroom');
    }
  }
  P('22:50','Pull-ups: finish today’s '+domTotal+' sets','gym','Plus 5 minutes of mobility');
  P('23:00','Journaling and reading','rutina');
  P('23:10','Daily log','clave','The last thing before lights off · 20 seconds',{cadena:'registro'});
  if(mañanaTrabajo) P('23:15','Lights off','clave','The first link of tomorrow’s chain',{cadena:'luz'});

  return it.sort((a,b) => toMin(a.t)-toMin(b.t));
}

// Calendar reminders with no fixed time
function tambien(s){
  const out = [], dd = pd(s).getDate();
  if(dd===1) out.push('Transfer '+TRANSFER);
  if(dd===2) out.push('Check that the ETF contribution has gone through');
  const t = ultimoTest();
  if(t && s>=HOY && add(t,14)<=s && s===HOY) out.push('Pull-up test due: one set to failure, from cold');
  return out;
}

// ═══ DATA ═══════════════════════════════════════════════════
const st = { days:{}, weeks:{}, tests:[], sel:HOY, editing:false, draft:null };

function setSync(c){ document.getElementById('sync').className = 'dot '+c; }
function sb(method, path, body, prefer){
  const h = { apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json' };
  if(prefer) h.Prefer = prefer;
  return fetch(SB_URL+'/rest/v1/'+path, { method, headers:h, body: body ? JSON.stringify(body) : undefined })
    .then(r => r.ok ? r.text().then(t => t ? JSON.parse(t) : null) : r.text().then(t => { throw new Error(r.status+' '+t); }));
}
const upsert = (table, conflict, row) => sb('POST', table+'?on_conflict='+conflict, row, 'return=representation,resolution=merge-duplicates');

async function cargar(){
  setSync('syncing');
  try{
    const desde = add(HOY,-70);
    const [days, weeks, tests] = await Promise.all([
      sb('GET','tracker_days?select=*&date=gte.'+desde),
      sb('GET','tracker_weeks?select=*&week_start=gte.'+add(lunes(HOY),-28)),
      sb('GET','pullup_tests?select=date&order=date.desc&limit=1').catch(() => [])
    ]);
    (days||[]).forEach(r => st.days[r.date] = r);
    (weeks||[]).forEach(r => st.weeks[r.week_start] = r.match_day);
    st.tests = tests || [];
    setSync('ok');
  }catch(e){ console.error(e); setSync('err'); toast('Couldn’t load. Check your connection'); }
}
const ultimoTest = () => st.tests.length ? st.tests[0].date : null;
const partidoDe = s => st.weeks[lunes(s)] || 'sab';

// ═══ TARGETS ════════════════════════════════════════════════
// Each day's row holds: phone that day, lights off THAT night, and the time you left home that morning.
// Lights off only has a target when the next day is a working day.
function objetivoLuz(s){ return laborable(add(s,1)) ? OBJ.luz : null; }
function estado(s){
  const r = st.days[s];
  const res = { movil:'none', luz:'none', salida: laborable(s) ? 'none' : 'na' };
  if(!r) return res;
  if(r.screen_min!=null) res.movil = r.screen_min <= OBJ.movil ? 'ok' : 'bad';
  if(r.lights_off){ const o = objetivoLuz(s); res.luz = !o ? 'neu' : (luzMin(r.lights_off) <= luzMin(o) ? 'ok' : 'bad'); }
  if(res.salida!=='na' && r.left_home) res.salida = toMin(r.left_home) <= toMin(OBJ.salida) ? 'ok' : 'bad';
  return res;
}
const registrado = s => { const r = st.days[s]; return !!(r && r.screen_min!=null && r.lights_off); };

// ═══ RENDER ═════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const esc = t => String(t).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function pintar(){
  const s = st.sel;
  $('dlbl').textContent = fmtDate(s);
  const n = diff(HOY, s);
  $('drel').textContent = n===0 ? 'Today' : n===1 ? 'Tomorrow' : n===-1 ? 'Yesterday' : n>0 ? 'In '+n+' days' : (-n)+' days ago';

  const m = partidoDe(s);
  [...$('match').children].forEach(b => b.classList.toggle('on', b.dataset.m===m));

  // Notices
  let ban = '';
  if(esFestivo(s)) ban += '<div class="banner"><b>Bank holiday.</b> No work and no class. A day with no structure: the closest thing to a Sunday in Enschede.</div>';
  tambien(s).forEach(t => ban += '<div class="banner also"><b>Also today:</b> '+esc(t)+'</div>');
  $('banners').innerHTML = ban;

  // Agenda
  const items = plan(s, m);
  let ahora = -1;
  if(s===HOY){
    const nm = q ? 12*60 : nowMin();
    items.forEach((x,i) => { if(toMin(x.t) <= nm) ahora = i; });
  }
  $('agenda').innerHTML = items.map((x,i) => {
    const cls = ['it'];
    if(x.k==='clave') cls.push('key');
    if(s===HOY && i<ahora) cls.push('past');
    if(s===HOY && i===ahora) cls.push('now');
    if(s<HOY) cls.push('past');
    const tag = s===HOY && i===ahora ? '<span class="tag">Now</span>' : s===HOY && i===ahora+1 ? '<span class="tag next">Next</span>' : '';
    return '<div class="'+cls.join(' ')+'"><span class="tm">'+x.t+'</span><span class="bar" style="background:var(--k-'+x.k+')"></span>'+
      '<span class="tx">'+esc(x.txt)+tag+(x.sub?'<small>'+esc(x.sub)+'</small>':'')+'</span></div>';
  }).join('');

  // Daily log: at the top in the evening or for a past day, at the bottom during the day
  const puede = s<=HOY && diff(s,HOY)<=3;
  const h = new Date().getHours();
  const tarde = s<HOY || h>=21 || h<DAY_END;
  $('regTop').innerHTML = ''; $('regBottom').innerHTML = '';
  if(puede) (tarde ? $('regTop') : $('regBottom')).appendChild(tarjetaRegistro(s));

  pintarSemana();
}

function tarjetaRegistro(s){
  const r = st.days[s], c = document.createElement('div');
  c.className = 'card';
  const hoy = s===HOY;
  const yaHecho = registrado(s) && !st.editing;
  const titulo = hoy ? 'Today’s log' : 'Log for '+fmtDate(s);

  if(yaHecho){
    const e = estado(s);
    const celda = (l, v, k) => '<div class="c"><div class="l">'+l+'</div><div class="n '+(k==='ok'?'ok-t':k==='bad'?'bad-t':'neu-t')+'">'+v+'</div></div>';
    c.innerHTML = '<div class="ct"><b>'+titulo+'</b><span>Done</span></div>'+
      '<div class="chainnote">Phone → lights off → leaving home. If one slips, look at the one before it.</div>'+
      '<div class="done">'+
        celda('Phone', fmtMov(r.screen_min), e.movil)+
        celda('Lights off', r.lights_off || '–', e.luz)+
        (e.salida==='na' ? '' : celda('Left home', r.left_home || '–', e.salida))+
      '</div><button class="link" id="edit">Edit</button>';
    c.querySelector('#edit').onclick = () => { st.editing = true; st.draft = null; pintar(); };
    return c;
  }

  // Draft. Lights off starts at the current time when you log tonight (you log right before switching off).
  // For a past day, it starts with the last value from a similar night, not the target,
  // so leaving it untouched is never a free win.
  if(!st.draft || st.draft.s!==s){
    const o = objetivoLuz(s);
    const previo = campo => { for(let i=1;i<=14;i++){ const p = add(s,-i), x = st.days[p]; if(x && x[campo] && (campo==='left_home' || !!objetivoLuz(p)===!!o)) return x[campo]; } return null; };
    const hr = new Date().getHours();
    const ahoraLuz = hoy && !q && (hr>=20 || hr<DAY_END) ? Math.ceil(nowMin()/5)*5 : null;
    st.draft = {
      s,
      h: r && r.screen_min!=null ? Math.floor(r.screen_min/60) : '',
      mi: r && r.screen_min!=null ? r.screen_min%60 : '',
      luz: r && r.lights_off ? luzMin(r.lights_off) : ahoraLuz!=null ? ahoraLuz : luzMin(previo('lights_off') || o || '23:30'),
      sal: toMin((r && r.left_home) || previo('left_home') || OBJ.salida)
    };
  }
  const D = st.draft, conSalida = laborable(s), oLuz = objetivoLuz(s);

  c.innerHTML = '<div class="ct"><b>'+titulo+'</b><span>Once a day, at the end of it</span></div>'+
    '<div class="chainnote">One chain: phone at night → late lights off → leaving home late.</div>'+
    '<div class="row"><div class="q"><span>'+(hoy?'Phone today':'Phone that day')+' (Screen Time)</span><em id="vm"></em></div>'+
      '<div class="hm"><input id="ih" inputmode="numeric" pattern="[0-9]*" placeholder="0"><span class="u">h</span>'+
      '<input id="im" inputmode="numeric" pattern="[0-9]*" placeholder="0"><span class="u">min</span></div></div>'+
    '<div class="row"><div class="q"><span>'+(hoy?'Lights off tonight at':'Lights off that night at')+'</span><em id="vl"></em></div>'+
      '<div class="step"><button id="lmenos">−</button><div class="v" id="lv"></div><button id="lmas">+</button></div></div>'+
    (conSalida ? '<div class="row"><div class="q"><span>'+(hoy?'This morning you left home at':'You left home at')+'</span><em id="vs"></em></div>'+
      '<div class="step"><button id="smenos">−</button><div class="v" id="sv"></div><button id="smas">+</button></div></div>' : '')+
    '<button class="save" id="guardar">Save</button>';

  const ih = c.querySelector('#ih'), im = c.querySelector('#im');
  ih.value = D.h; im.value = D.mi;
  const movil = () => { const h = parseInt(ih.value,10), m = parseInt(im.value,10); if(isNaN(h) && isNaN(m)) return null; return (isNaN(h)?0:h)*60 + (isNaN(m)?0:m); };
  const verd = (el, ok, txtOk, txtBad) => { el.textContent = ok==null ? '' : ok ? txtOk : txtBad; el.className = ok==null ? 'neu-t' : ok ? 'ok-t' : 'bad-t'; };
  const refrescar = () => {
    D.h = ih.value; D.mi = im.value;
    const mv = movil();
    verd(c.querySelector('#vm'), mv==null ? null : mv <= OBJ.movil, 'On target', 'Over 1 h 30');
    c.querySelector('#lv').textContent = fmt(D.luz);
    if(oLuz) verd(c.querySelector('#vl'), D.luz <= luzMin(oLuz), 'On time', 'Late'); else { const e = c.querySelector('#vl'); e.textContent = 'No work tomorrow'; e.className = 'neu-t'; }
    if(conSalida){
      c.querySelector('#sv').textContent = fmt(D.sal);
      verd(c.querySelector('#vs'), D.sal <= toMin(OBJ.salida), 'On time', 'Late');
    }
    c.querySelector('#guardar').disabled = mv==null;
  };
  ih.oninput = refrescar; im.oninput = refrescar;
  [ih, im].forEach(i => i.onfocus = () => i.select());
  const paso = (id, campo, delta, min, max) => c.querySelector(id).onclick = () => { D[campo] = Math.min(max, Math.max(min, D[campo]+delta)); refrescar(); };
  paso('#lmenos','luz',-5, 20*60, (24+DAY_END)*60); paso('#lmas','luz',5, 20*60, (24+DAY_END)*60);
  if(conSalida){ paso('#smenos','sal',-5, 6*60, 10*60); paso('#smas','sal',5, 6*60, 10*60); }
  c.querySelector('#guardar').onclick = () => guardar(s, movil(), fmt(D.luz), conSalida ? fmt(D.sal) : null);
  refrescar();
  return c;
}

async function guardar(s, mv, luz, sal){
  const row = { date:s, screen_min:mv, lights_off:luz, left_home:sal, updated_at:new Date().toISOString() };
  st.days[s] = row; st.editing = false; st.draft = null;
  pintar(); toast('Logged');
  setSync('syncing');
  try{ await upsert('tracker_days','date',row); setSync('ok'); }
  catch(e){ console.error(e); setSync('err'); toast('Not saved. Try again'); }
}

async function cambiarPartido(m){
  const w = lunes(st.sel);
  st.weeks[w] = m; pintar();
  setSync('syncing');
  try{ await upsert('tracker_weeks','week_start',{ week_start:w, match_day:m }); setSync('ok'); toast(m==='dom' ? 'Week with a Sunday match' : 'Week with a Saturday match'); }
  catch(e){ console.error(e); setSync('err'); toast('Not saved'); }
}

function pintarSemana(){
  const fin = st.sel > HOY ? HOY : st.sel;
  let h = '';
  for(let i=6; i>=0; i--){
    const s = add(fin,-i), e = estado(s), d = pd(s);
    const dot = k => '<i class="'+(['ok','bad','na','neu'].includes(k)?k:'')+'"></i>';
    h += '<div class="wd'+(s===st.sel?' sel':'')+'" data-s="'+s+'"><div class="l">'+DAYS[d.getDay()].slice(0,3)+'</div><div class="n">'+d.getDate()+'</div>'+
      '<div class="ds">'+dot(e.movil)+dot(e.luz)+dot(e.salida)+'</div></div>';
  }
  $('week').innerHTML = h;
  [...$('week').children].forEach(x => x.onclick = () => { st.sel = x.dataset.s; st.editing = false; st.draft = null; pintar(); });

  // Rule for adding the next habit: 4 weeks in a row logging 6 of 7 days
  const semActual = lunes(HOY);
  let racha = 0;
  for(let w = add(semActual,-7); ; w = add(w,-7)){
    let n = 0; for(let i=0;i<7;i++) if(registrado(add(w,i))) n++;
    if(n>=6) racha++; else break;
    if(racha>=8) break;
  }
  let esta = 0; for(let i=0;i<7;i++){ const s = add(semActual,i); if(s<=HOY && registrado(s)) esta++; }
  const prog = Math.min(racha,4);
  $('rule').innerHTML = 'This week you’ve logged <b>'+esta+' of 7</b> days. '+
    (prog>=4 ? '<b>Four weeks in a row with 6 of 7: time to add the next habit.</b>'
             : 'Weeks in a row with 6 of 7: <b>'+prog+' of 4</b>. When you reach four, the next habit comes in. Logging is what counts, not hitting the targets.')+
    '<div class="prog">'+[0,1,2,3].map(i => '<i class="'+(i<prog?'on':'')+'"></i>').join('')+'</div>';
}

// ═══ EVENTS ═════════════════════════════════════════════════
$('prev').onclick = () => { st.sel = add(st.sel,-1); st.editing = false; st.draft = null; pintar(); };
$('next').onclick = () => { st.sel = add(st.sel, 1); st.editing = false; st.draft = null; pintar(); };
$('match').onclick = e => { const m = e.target.dataset.m; if(m && m!==partidoDe(st.sel)) cambiarPartido(m); };

let tt;
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1600); }

// Coming back on another day reloads the app; on the same day it repaints to move "Now"
document.addEventListener('visibilitychange', () => {
  if(document.hidden) return;
  if(!q && logicalToday()!==HOY) location.reload(); else pintar();
});
setInterval(() => { const a = document.activeElement; if(!document.hidden && !(a && a.tagName==='INPUT')) pintar(); }, 5*60*1000);

pintar();
cargar().then(() => { st.draft = null; pintar(); });
</script>
